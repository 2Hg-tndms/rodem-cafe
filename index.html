<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>로뎀카페</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
--cream:#FBF5E9;
--paper:#FFFEFA;
--ink:#221E19;
--ink-soft:#5C554A;
--line:#E2D8C2;
--sage:#7C8F63;
--sage-deep:#5E6E48;
--apricot:#EE9457;
--apricot-deep:#D97A3B;
--brown:#8B5A3C;
--danger:#C0503B;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
background:var(--cream);
color:var(--ink);
font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
-webkit-font-smoothing:antialiased;
min-height:100vh;
}
.display{font-family:'Jua','Gowun Dodum',sans-serif;}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:96px;background:var(--cream);}
/* ---- header ---- */
.header{
position:sticky;top:0;z-index:30;
background:var(--cream);
padding:18px 18px 10px;
border-bottom:2px dashed var(--line);
}
.brand-row{display:flex;align-items:center;justify-content:center;gap:8px;}
.brand-title{font-size:30px;color:var(--ink);letter-spacing:1px;}
.brand-sub{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:2px;letter-spacing:2px;}
.doodle-divider{width:100%;height:14px;margin:10px 0 2px;opacity:0.55;}
/* ---- category tabs ---- */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{
flex:0 0 auto;
font-family:'Jua',sans-serif;
font-size:14px;
padding:8px 16px;
border-radius:999px;
border:2px solid var(--ink);
background:var(--paper);
color:var(--ink);
cursor:pointer;
white-space:nowrap;
}
.tab-btn.active{background:var(--ink);color:var(--cream);}
/* ---- menu list ---- */
.menu-list{padding:6px 16px 12px;}
.menu-card{
display:flex;justify-content:space-between;align-items:center;
background:var(--paper);
border:1.5px solid var(--line);
border-radius:16px;
padding:14px 16px;
margin-bottom:10px;
cursor:pointer;
transition:transform .08s ease;
}
.menu-card:active{transform:scale(0.98);}
.menu-name{font-size:16px;font-weight:700;color:var(--ink);}
.menu-en{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.menu-price{font-family:'Jua',sans-serif;font-size:18px;color:var(--brown);text-align:right;white-space:nowrap;}
.menu-price small{font-size:13px;color:var(--ink-soft);display:block;font-family:'Gowun Dodum',sans-serif;}
.section-label{
font-family:'Jua',sans-serif;
font-size:13px;color:var(--sage-deep);
padding:14px 16px 2px;
display:flex;align-items:center;gap:6px;
}
/* ---- overlay / sheet ---- */
.overlay{
position:fixed;inset:0;background:rgba(34,30,25,0.45);
z-index:50;display:flex;align-items:flex-end;justify-content:center;
}
.overlay.center{align-items:center;}
.sheet{
width:100%;max-width:480px;background:var(--cream);
border-radius:24px 24px 0 0;
padding:20px 20px calc(20px + env(safe-area-inset-bottom));
max-height:88vh;overflow-y:auto;
animation:sheetUp .18s ease-out;
}
@keyframes sheetUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:40px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 14px;position:relative;cursor:grab;}
.sheet-handle::after{content:'';position:absolute;top:-16px;left:-220px;right:-220px;bottom:-16px;}
.opt-row{display:flex;gap:10px;margin:14px 0;}
.opt-btn{
flex:1;padding:14px 0;text-align:center;
border-radius:14px;border:2px solid var(--ink);
font-family:'Jua',sans-serif;font-size:15px;background:var(--paper);cursor:pointer;
}
.opt-btn.active{background:var(--apricot);border-color:var(--apricot-deep);color:#fff;}
.qty-row{display:flex;align-items:center;justify-content:center;gap:20px;margin:18px 0 22px;}
.qty-btn{
width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);
background:var(--paper);font-size:20px;line-height:1;font-family:'Jua',sans-serif;cursor:pointer;
display:flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto;
-webkit-tap-highlight-color:transparent;user-select:none;
}
.qty-num{font-family:'Jua',sans-serif;font-size:20px;min-width:26px;text-align:center;}
.shot-toggle{
display:flex;align-items:center;justify-content:space-between;
border:2px solid var(--ink);border-radius:14px;padding:12px 16px;margin-top:14px;cursor:pointer;
}
.shot-toggle.active{background:var(--sage);border-color:var(--sage-deep);color:#fff;}
.shot-check{
width:22px;height:22px;border-radius:6px;border:2px solid currentColor;
display:flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 auto;
}
.primary-btn{
width:100%;padding:16px 0;border:none;border-radius:16px;
background:var(--ink);color:var(--cream);
font-family:'Jua',sans-serif;font-size:16px;cursor:pointer;
}
.primary-btn:disabled{opacity:0.4;}
.ghost-btn{
width:100%;padding:14px 0;border:2px solid var(--ink);border-radius:16px;
background:transparent;color:var(--ink);font-family:'Jua',sans-serif;font-size:15px;cursor:pointer;
}
/* ---- floating cart bar ---- */
.cart-bar{
position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
width:calc(100% - 36px);max-width:444px;
background:var(--ink);color:var(--cream);
border-radius:18px;padding:14px 18px;
display:flex;justify-content:space-between;align-items:center;
cursor:pointer;z-index:20;box-shadow:0 8px 24px rgba(34,30,25,0.28);
}
.cart-bar-left{font-family:'Jua',sans-serif;font-size:14px;display:flex;align-items:center;gap:8px;}
.cart-badge{background:var(--apricot);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;}
.cart-bar-right{font-family:'Jua',sans-serif;font-size:16px;}
/* ---- cart drawer ---- */
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
.cart-item-name{font-size:14px;font-weight:700;}
.cart-item-opt{font-size:11px;color:var(--ink-soft);}
.cart-item-ctrl{display:flex;align-items:center;gap:10px;}
.mini-btn{
width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);background:var(--paper);
font-size:15px;line-height:1;cursor:pointer;
display:flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto;
-webkit-tap-highlight-color:transparent;user-select:none;
}
.remove-x{color:var(--danger);font-size:12px;margin-left:8px;cursor:pointer;text-decoration:underline;}
.total-row{display:flex;justify-content:space-between;align-items:center;padding:16px 0 4px;font-family:'Jua',sans-serif;font-size:18px;}
/* ---- checkout ---- */
.field-label{font-size:13px;color:var(--ink-soft);margin:4px 0 6px;}
.text-input{
width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);
font-family:'Gowun Dodum',sans-serif;font-size:15px;background:var(--paper);
}
.pay-card{
background:var(--paper);border:1.5px dashed var(--apricot-deep);
border-radius:18px;padding:18px;margin:16px 0;text-align:center;
}
.pay-card img{width:160px;border-radius:10px;margin-bottom:10px;border:1px solid var(--line);}
.account-box{
background:var(--cream);border-radius:12px;padding:10px 14px;margin-top:8px;
display:flex;justify-content:space-between;align-items:center;
}
.account-text{text-align:left;font-size:13px;}
.account-text b{font-family:'Jua',sans-serif;font-size:15px;display:block;}
.copy-btn{border:1.5px solid var(--ink);background:var(--paper);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;}
.amount-big{font-family:'Jua',sans-serif;font-size:30px;color:var(--apricot-deep);text-align:center;margin:6px 0 2px;}
/* ---- confirm / done ---- */
.done-wrap{padding:60px 24px;text-align:center;}
.order-num-badge{
display:inline-block;font-family:'Jua',sans-serif;font-size:44px;color:var(--ink);
background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:14px 30px;margin:18px 0;
}
/* ---- counter view ---- */
.counter-wrap{max-width:640px;margin:0 auto;padding:0 0 40px;}
.counter-header{
background:var(--ink);color:var(--cream);padding:20px 20px 16px;position:sticky;top:0;z-index:10;
}
.counter-tabs{display:flex;gap:8px;padding:14px 20px 0;}
.ctab{flex:1;text-align:center;padding:10px 0;border-radius:12px;font-family:'Jua',sans-serif;font-size:14px;border:2px solid var(--ink);cursor:pointer;background:var(--paper);}
.ctab.active{background:var(--ink);color:var(--cream);}
.order-card{
background:var(--paper);border:1.5px solid var(--line);border-radius:16px;
margin:12px 20px;padding:16px;
}
.order-card.done{opacity:0.55;}
.order-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.order-no{font-family:'Jua',sans-serif;font-size:20px;}
.order-time{font-size:11px;color:var(--ink-soft);}
.order-name{font-size:13px;color:var(--ink-soft);margin-bottom:6px;}
.order-items{font-size:14px;line-height:1.7;margin-bottom:10px;}
.order-total{font-family:'Jua',sans-serif;font-size:16px;color:var(--brown);}
.empty-state{text-align:center;padding:60px 24px;color:var(--ink-soft);}
.version-badge{
position:fixed;right:8px;bottom:6px;z-index:5;
font-size:10px;color:#B7AE9C;font-family:'Gowun Dodum',sans-serif;
letter-spacing:0.5px;pointer-events:none;user-select:none;
}
.sales-wrap{max-width:640px;margin:0 auto;padding:0 0 60px;}
.hamburger{cursor:pointer;font-size:22px;line-height:1;padding:4px 8px;user-select:none;-webkit-tap-highlight-color:transparent;}
.nav-menu{position:fixed;inset:0;background:rgba(34,30,25,0.5);z-index:60;display:flex;align-items:flex-start;justify-content:flex-end;}
.nav-menu-box{background:var(--cream);margin:56px 16px 0;border-radius:16px;padding:10px;min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,0.25);}
.nav-item{padding:14px 16px;font-family:'Jua',sans-serif;font-size:15px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:8px;}
.nav-item:hover{background:var(--paper);}
.nav-item.active{background:var(--ink);color:var(--cream);}.sales-header{background:var(--ink);color:var(--cream);padding:20px;position:sticky;top:0;z-index:10;}
.sales-tabs{display:flex;gap:8px;padding:14px 20px 0;}
.sales-card{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;margin:12px 20px;padding:16px;}
.sales-date-btn{
display:flex;justify-content:space-between;align-items:center;
background:var(--paper);border:1.5px solid var(--line);border-radius:14px;
margin:10px 20px;padding:16px;cursor:pointer;
}
.sales-date-btn .d{font-family:'Jua',sans-serif;font-size:16px;}
.sales-date-btn .amt{font-family:'Jua',sans-serif;font-size:16px;color:var(--brown);}
.sales-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;}
.sales-row.head{font-family:'Jua',sans-serif;color:var(--sage-deep);border-bottom:2px solid var(--line);}
.sales-row.menu-sum{background:var(--cream);border-radius:8px;margin:2px 0;padding-left:4px;}
.sales-row .q{width:60px;text-align:right;color:var(--ink-soft);}
.sales-row .a{width:90px;text-align:right;font-family:'Jua',sans-serif;}
.sales-total-box{background:var(--ink);color:var(--cream);border-radius:14px;padding:16px;margin:12px 20px;}
.sales-total-box .big{font-family:'Jua',sans-serif;font-size:26px;margin-top:4px;}
.cost-input{width:80px;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);font-size:14px;text-align:right;font-family:'Gowun Dodum',sans-serif;}
.cat-chip{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;background:var(--cream);color:var(--sage-deep);margin-left:6px;}
/* 주문 편집 모달 */
.edit-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:8px;}
.edit-item-name{font-size:14px;flex:1;}
.edit-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px;}
.edit-menu-cell{border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--paper);}
.edit-menu-title{font-size:13px;font-weight:700;text-align:center;margin-bottom:6px;min-height:32px;display:flex;align-items:center;justify-content:center;}
.edit-temp-row{display:flex;gap:4px;margin-bottom:6px;}
.edit-temp-btn{flex:1;padding:5px 0;text-align:center;border-radius:8px;border:1.5px solid var(--ink);font-size:12px;background:var(--paper);cursor:pointer;font-family:'Jua',sans-serif;}
.edit-temp-btn.active{background:var(--apricot);border-color:var(--apricot-deep);color:#fff;}
.edit-shot-row{display:flex;align-items:center;justify-content:space-between;font-size:11px;margin-bottom:6px;}
.edit-shot-ctrl{display:flex;align-items:center;gap:6px;}
.edit-mini{width:24px;height:24px;border-radius:6px;border:1.5px solid var(--ink);background:var(--paper);font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;}
.edit-add-btn{width:100%;padding:6px 0;border-radius:8px;border:none;background:var(--ink);color:var(--cream);font-size:12px;font-family:'Jua',sans-serif;cursor:pointer;}
.bell-label{font-size:24px;font-weight:700;color:var(--ink);margin:8px 0 14px;font-family:'Jua',sans-serif;text-align:center;}
.bell-input{
width:100%;padding:16px 14px;border-radius:14px;border:2px solid var(--ink);
font-family:'Jua',sans-serif;font-size:26px;text-align:center;background:var(--paper);
color:var(--ink);letter-spacing:2px;
}
.bell-input::placeholder{font-size:15px;color:var(--ink-soft);letter-spacing:0;}
.bell-pad{
display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px;
}
.bell-key{
padding:16px 0;text-align:center;border-radius:12px;border:2px solid var(--ink);
background:var(--paper);font-family:'Jua',sans-serif;font-size:20px;cursor:pointer;
-webkit-tap-highlight-color:transparent;user-select:none;
}
.bell-key.active{background:var(--apricot);border-color:var(--apricot-deep);color:#fff;}
.bell-key.clear{grid-column:span 5;font-size:15px;background:transparent;color:var(--ink-soft);}
</style>

function fmt(n){ return n.toLocaleString('ko-KR'); }
function optLabel(temp, shot){
const parts = [];
if(temp) parts.push(temp.toUpperCase());
if(shot) parts.push('샷추가');
return parts.join(' · ');
}
function makeDraggable(sheetEl, onClose){
if(!sheetEl) return;
const handle = sheetEl.querySelector('.sheet-handle') || sheetEl;
let startY = 0, dy = 0;
function onMove(e){
const y = e.touches ? e.touches[0].clientY : e.clientY;
dy = Math.max(0, y - startY);
sheetEl.style.transform = `translateY(${dy}px)`;
}
function onUp(){
document.removeEventListener('mousemove', onMove);
document.removeEventListener('mouseup', onUp);
document.removeEventListener('touchmove', onMove);
document.removeEventListener('touchend', onUp);
sheetEl.style.transition = 'transform .18s ease';
if(dy > 90){
sheetEl.style.transform = 'translateY(100%)';
setTimeout(onClose, 140);
} else {
sheetEl.style.transform = 'translateY(0)';
}
}
function onDown(e){
dy = 0;
startY = e.touches ? e.touches[0].clientY : e.clientY;
sheetEl.style.transition = 'none';
document.addEventListener('mousemove', onMove);
document.addEventListener('mouseup', onUp);
document.addEventListener('touchmove', onMove, {passive:true});
document.addEventListener('touchend', onUp);
}
handle.addEventListener('mousedown', onDown);
handle.addEventListener('touchstart', onDown, {passive:true});
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

fill="none" stroke="#221E19" stroke-width="1.4" stroke-dasharray="1 7" stroke-linecap="round"/>

</svg>`;
}

/* ===================== app state ===================== */
let cart = []; // {key,id,name,en,temp,shot,price,qty}
let activeCat = MENU[0].cat;
let sheetItem = null; // item currently in the option sheet
let sheetCat = null; // category of the item in the option sheet
let sheetTemp = null;
let sheetShot = false;
let sheetQty = 1;
let showCartDrawer = false;
let stage = 'menu'; // menu | checkout | done
let bellNo = '';
let cashPlanned = false;
let couponPlanned = false;
let lastOrder = null;
let submitting = false;
const SHOT_PRICE = 500;
const SHOT_CATS = ['COFFEE','NON COFFEE','TEA'];
let logoClicks = 0;
let logoClickTimer = null;

function cartCount(){ return cart.reduce((s,c)=>s+c.qty,0); }
function cartTotal(){ return cart.reduce((s,c)=>s+c.qty*c.price,0); }
function addToCart(item, temp, qty, shot){
const base = temp==='hot' ? item.hot : temp==='ice' ? item.ice : item.single;
const price = base + (shot ? SHOT_PRICE : 0);
const key = item.id+'-'+(temp||'single')+(shot?'-shot':'');
const existing = cart.find(c=>c.key===key);
if(existing){ existing.qty += qty; }
else { cart.push({ key, id:item.id, name:item.name, en:item.en, temp, shot:!!shot, price, qty }); }
}
function openSheet(item, cat){
sheetItem = item;
sheetCat = cat;
sheetTemp = item.hot ? 'hot' : (item.ice ? 'ice' : null);
sheetShot = false;
sheetQty = 1;
render();
}
function closeSheet(){ sheetItem=null; render(); }

</div>
<div style="padding:16px 18px;">

function render(){
const app = document.getElementById('app');
let html = '';
if(stage==='menu') html = renderMenuScreen();
else if(stage==='checkout') html = renderCheckout();
else if(stage==='done') html = renderDone();
html += renderOptionSheet();
html += renderCartDrawer();
app.innerHTML = html;
attachHandlers();
}
function attachHandlers(){
const brandLogo = document.getElementById('brandLogo');
if(brandLogo) brandLogo.onclick = ()=>{
logoClicks++;
clearTimeout(logoClickTimer);
logoClickTimer = setTimeout(()=>{ logoClicks = 0; }, 1500);
if(logoClicks >= 5){
logoClicks = 0;
location.hash = '#counter';
}
};
document.querySelectorAll('.tab-btn').forEach(b=>{
b.onclick = ()=>{ activeCat = b.dataset.cat; render(); };
});
document.querySelectorAll('.menu-card').forEach(c=>{
c.onclick = ()=>{
const id = c.dataset.item;
const item = MENU.flatMap(m=>m.items).find(i=>i.id===id);
openSheet(item, activeCat);
};
});
const cartBar = document.getElementById('cartBar');
if(cartBar) cartBar.onclick = ()=>{ showCartDrawer = true; render(); };
// option sheet
const sheetOverlay = document.getElementById('sheetOverlay');
if(sheetOverlay){
sheetOverlay.onclick = (e)=>{ if(e.target.id==='sheetOverlay') closeSheet(); };
makeDraggable(document.getElementById('sheetBody'), closeSheet);
document.querySelectorAll('.opt-btn').forEach(b=>{
b.onclick = ()=>{ sheetTemp = b.dataset.temp; render(); };
});
const shotToggle = document.getElementById('shotToggle');
if(shotToggle) shotToggle.onclick = ()=>{ sheetShot = !sheetShot; render(); };
const minus = document.getElementById('qtyMinus');
const plus = document.getElementById('qtyPlus');
if(minus) minus.onclick = ()=>{ if(sheetQty>1) sheetQty--; render(); };
if(plus) plus.onclick = ()=>{ sheetQty++; render(); };
const addBtn = document.getElementById('addCartBtn');
if(addBtn) addBtn.onclick = ()=>{
addToCart(sheetItem, sheetTemp, sheetQty, SHOT_CATS.includes(sheetCat) && sheetShot);
sheetItem = null;
render();
};
}
// cart drawer
const cartOverlay = document.getElementById('cartOverlay');
if(cartOverlay){
cartOverlay.onclick = (e)=>{ if(e.target.id==='cartOverlay'){ showCartDrawer=false; render(); } };
makeDraggable(document.getElementById('cartSheetBody'), ()=>{ showCartDrawer=false; render(); });
document.querySelectorAll('[data-act]').forEach(el=>{
el.onclick = ()=>{
const key = el.dataset.key;
const c = cart.find(x=>x.key===key);
if(!c) return;
if(el.dataset.act==='minus'){ c.qty--; if(c.qty<=0) cart = cart.filter(x=>x.key!==key); }
if(el.dataset.act==='plus'){ c.qty++; }
if(el.dataset.act==='remove'){ cart = cart.filter(x=>x.key!==key); }
render();
};
});
const closeCartBtn = document.getElementById('closeCartBtn');
if(closeCartBtn) closeCartBtn.onclick = ()=>{ showCartDrawer=false; render(); };
const goCheckoutBtn = document.getElementById('goCheckoutBtn');
if(goCheckoutBtn) goCheckoutBtn.onclick = ()=>{ showCartDrawer=false; stage='checkout'; render(); };
}
// checkout - 진동벨 번호 입력
const bellInput = document.getElementById('bellInput');
function syncBellUI(){
if(bellInput) bellInput.value = bellNo;
document.querySelectorAll('.bell-key[data-bell]').forEach(k=>{
if(k.dataset.bell==='clear') return;
k.classList.toggle('active', k.dataset.bell===bellNo);
});
}
if(bellInput){
bellInput.oninput = (e)=>{
// 숫자만 허용, 1~10 범위로 제한
let v = e.target.value.replace(/[^0-9]/g,'');
if(v!==''){
let n = parseInt(v,10);
if(n>10) n=10;
if(n<1) v=''; else v=String(n);
}
bellNo = v;
e.target.value = v;
syncBellUI();
};
}
document.querySelectorAll('.bell-key[data-bell]').forEach(k=>{
k.onclick = ()=>{
if(k.dataset.bell==='clear'){ bellNo=''; }
else { bellNo = k.dataset.bell; }
syncBellUI();
};
});
const copyBtn = document.getElementById('copyAccountBtn');
if(copyBtn) copyBtn.onclick = ()=>{
navigator.clipboard.writeText(ACCOUNT.number.replace(/-/g,''));
copyBtn.textContent = '복사됨';
setTimeout(()=>{ copyBtn.textContent='복사'; },1500);
};
const cashToggle = document.getElementById('cashToggle');
if(cashToggle) cashToggle.onclick = ()=>{ cashPlanned = !cashPlanned; render(); };
const couponToggle = document.getElementById('couponToggle');
if(couponToggle) couponToggle.onclick = ()=>{ couponPlanned = !couponPlanned; render(); };
const backBtn = document.getElementById('backToCartBtn');
if(backBtn) backBtn.onclick = ()=>{ stage='menu'; showCartDrawer=true; render(); };
const confirmBtn = document.getElementById('confirmPayBtn');
if(confirmBtn) confirmBtn.onclick = submitOrder;
const newOrderBtn = document.getElementById('newOrderBtn');
if(newOrderBtn) newOrderBtn.onclick = ()=>{
cart = []; bellNo=''; cashPlanned=false; couponPlanned=false; stage='menu'; lastOrder=null; render();
};
}

const API = '/api/orders';

async function submitOrder(){
const n = parseInt(bellNo,10);
if(!bellNo || isNaN(n) || n<1 || n>10){
alert('진동벨 번호(1~10)를 입력해주세요');
return;
}
submitting = true; render();
try{
const res = await fetch(API, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({
name: bellNo,
bell: bellNo,
items: cart.map(c=>({ name:c.name, temp:c.temp, shot:c.shot, price:c.price, qty:c.qty })),
total: cartTotal(),
cash: cashPlanned,
coupon: couponPlanned
})
});
if(res.status === 403){
submitting = false;
renderClosedNotice();
return;
}
if(!res.ok) throw new Error('bad response');
const data = await res.json();
lastOrder = data.order;
submitting = false;
stage = 'done';
render();
}catch(e){
submitting = false;
alert('디버그: ' + e.message);
render();
}
}

/* ===================== counter (staff) view ===================== */
let counterFilter = 'pending';
let counterOrders = [];

// ===== 자동 영수증 출력용 상태 =====
// 이미 출력한 주문 id 기억 (중복 출력 방지)
const autoPrintedIds = new Set();
// 첫 로딩 여부. 카운터를 처음 열었을 때 기존 주문이 한꺼번에 찍히는 걸 막음
let autoPrintPrimed = false;
// 자동 출력 켜기/끄기
let autoPrintEnabled = true;
let cafeIsOpen = false; // 카운터에서 보는 현재 오픈 상태

async function loadOrders(){
// 편집 모달이 열려있으면 화면 갱신을 미룸 (편집 중 데이터 어긋남 방지)
if(editState){ return; }
try{
const res = await fetch(API);
const data = await res.json();
const orders = data.orders || [];
orders.sort((a,b)=>b.createdAt-a.createdAt);
counterOrders = orders;
cafeIsOpen = data.isOpen === true;

// ===== 새 주문 자동 출력 =====
if(!autoPrintPrimed){
// 첫 로딩: 기존 주문들은 출력하지 않고 "이미 본 것"으로만 표시
orders.forEach(o=>autoPrintedIds.add(o.id));
autoPrintPrimed = true;
} else if(autoPrintEnabled){
// 아직 출력 안 했고 대기중인 주문만, 접수된 순서(오래된 것 먼저)로 출력
const toPrint = orders
.filter(o=> o.status==='pending' && !autoPrintedIds.has(o.id))
.sort((a,b)=> a.createdAt - b.createdAt);
for(const o of toPrint){
autoPrintedIds.add(o.id); // 출력 시도 전에 먼저 기록해서 중복 방지
await printReceipt(o, false);
}
}
}catch(e){ counterOrders = []; }
renderCounter();
}

async function deleteOrder(order){
if(!confirm(order.number+'번 주문을 삭제할까요? 되돌릴 수 없어요.')) return;
try{
await fetch(API, {
method: 'DELETE',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ id: order.id })
});
}catch(_){}
loadOrders();
}

async function toggleStatus(order){
const newStatus = order.status==='pending' ? 'done' : 'pending';
order.status = newStatus;
try{
await fetch(API, {
method: 'PUT',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ id: order.id, status: newStatus })
});
}catch(_){}
loadOrders();
}

// editContext: 'counter' 또는 'sales'
let editState = null; // { order(복제본), context, saleDate }

function recalcTotal(items){
  return items.reduce((s,it)=> s + (it.price||0)*(it.qty||1), 0);
}

function openEditOrder(order, context, saleDate){
  // 원본을 건드리지 않게 깊은 복제
  editState = {
    context: context || 'counter',
    saleDate: saleDate || order.saleDate || null,
    order: JSON.parse(JSON.stringify(order))
  };
  renderEditModal();
}
function closeEditModal(){ editState = null; renderEditModal(); }

function priceOf(item, temp, shot){
  const base = temp==='hot' ? item.hot : temp==='ice' ? item.ice : item.single;
  return (base||0) + (shot ? SHOT_PRICE : 0);
}

    </div>
  </div>`;

  // 이벤트
  const ov = document.getElementById('editOverlay');
  ov.onclick = (e)=>{ if(e.target.id==='editOverlay') closeEditModal(); };

  host.querySelectorAll('[data-eminus]').forEach(b=>b.onclick=()=>{

  });
  host.querySelectorAll('[data-eplus]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.eplus; items[i].qty=(items[i].qty||1)+1; renderEditModal();
  });
  host.querySelectorAll('[data-eremove]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.eremove; items.splice(i,1); renderEditModal();
  });

  // 새 메뉴 옵션 상태
  if(!editState._new) editState._new = {};
  host.querySelectorAll('[data-ntemp]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.ntemp; const it=MENU.flatMap(s=>s.items).find(x=>x.id===id);
    if(!editState._new[id]) editState._new[id]={ temp:it.hot?'hot':'ice', shot:false };
    editState._new[id].temp=b.dataset.tv; renderEditModal();
  });
  host.querySelectorAll('[data-nshot]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.nshot; const it=MENU.flatMap(s=>s.items).find(x=>x.id===id);
    if(!editState._new[id]) editState._new[id]={ temp:it.hot?'hot':(it.ice?'ice':null), shot:false };
    editState._new[id].shot = b.dataset.sv==='1'; renderEditModal();
  });
  host.querySelectorAll('[data-nadd]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.nadd; const it=MENU.flatMap(s=>s.items).find(x=>x.id===id);
    const sec=MENU.find(s=>s.items.some(x=>x.id===id));
    const st = editState._new[id] || { temp: it.hot?'hot':(it.ice?'ice':null), shot:false };
    const canShot = SHOT_CATS.includes(sec.cat);
    const shot = canShot && st.shot;
    const price = priceOf(it, st.temp, shot);
    const key = id+'-'+(st.temp||'single')+(shot?'-shot':'');
    const exist = items.find(x=> (x.id===id && x.temp===st.temp && x.shot===shot));
    if(exist){ exist.qty=(exist.qty||1)+1; }
    else { items.push({ id:it.id, name:it.name, temp:st.temp, shot:!!shot, price, qty:1 }); }
    renderEditModal();
  });

  document.getElementById('editCancelBtn').onclick = closeEditModal;
  document.getElementById('editSaveBtn').onclick = saveEditOrder;
}

async function saveEditOrder(){
  if(!editState) return;
  const items = editState.order.items || [];
  if(items.length===0){
    alert('메뉴가 최소 1개는 있어야 해요. 주문을 없애려면 삭제 버튼을 사용하세요.');
    return;
  }
  const total = recalcTotal(items);
  const btn = document.getElementById('editSaveBtn');
  if(btn) btn.textContent='저장 중...';
  try{
    if(editState.context==='sales'){
      await fetch(SALES_API, {
        method:'PUT',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ saleDate: editState.saleDate, id: editState.order.id, items, total })
      });
    } else {
      await fetch(API, {
        method:'PUT',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ id: editState.order.id, items, total })
      });
    }
    const ctx = editState.context;
    closeEditModal();
    if(ctx==='sales') loadSales(); else loadOrders();
  }catch(e){
    alert('저장 실패. 다시 시도해주세요.');
    if(btn) btn.textContent='저장';
  }
}

const CAT_ORDER = MENU.map(m=>m.cat);

async function loadSales(){

  }
  renderSales();

// 판매 기록 배열 -> 메뉴별 {qty, amount} 집계
function aggregateItems(records){
  const byMenu = {};
  let total = 0, count = 0;
  records.forEach(r=>{
    total += (r.total||0);
    count += 1;
    (r.items||[]).forEach(it=>{
      const qty = it.qty || 1;
      const price = it.price || 0;
      // 옵션(HOT/ICE, 샷추가)까지 구분해서 별개 항목으로 집계
      const opt = optLabel(it.temp, it.shot);
      const label = it.name + (opt ? ` (${opt})` : '');
      const key = label;
      if(!byMenu[key]) byMenu[key] = { qty:0, amount:0, baseName: it.name, label };
      byMenu[key].qty += qty;
      byMenu[key].amount += price * qty;
    });
  });
  return { byMenu, total, count };
}

// 메뉴별 집계 -> 카테고리별 묶음
function groupByCat(byMenu){
  const cats = {};
  Object.keys(byMenu).forEach(key=>{
    const entry = byMenu[key];
    const cat = NAME_TO_CAT[entry.baseName] || '기타';
    if(!cats[cat]) cats[cat] = { items:{}, qty:0, amount:0 };
    cats[cat].items[key] = entry;
    cats[cat].qty += entry.qty;
    cats[cat].amount += entry.amount;
  });
  return cats;
}

// 원가 총합 계산 (원가는 메뉴 원본 이름 기준으로 매칭)
function calcCost(byMenu){
  let totalCost = 0;
  let hasCost = false;
  Object.keys(byMenu).forEach(key=>{
    const entry = byMenu[key];
    const c = salesCosts[entry.baseName];
    if(c != null && c !== ''){
      totalCost += Number(c) * entry.qty;
      hasCost = true;
    }
  });
  return { totalCost, hasCost };
}

function fmtDate(d){
  // "2025-08-10" -> "8/10 (일)"
  const parts = d.split('-');
  const dt = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
  const wd = ['일','월','화','수','목','금','토'][dt.getDay()];
  return `${Number(parts[1])}/${Number(parts[2])} (${wd})`;
}

// 월별로 날짜 묶기
function groupDatesByMonth(dates){
  const months = {};
  dates.forEach(d=>{
    const m = d.slice(0,7); // YYYY-MM
    if(!months[m]) months[m] = [];
    months[m].push(d);
  });
  return months;
}

function salesDetailHtml(records, saleDate, showOrders){
  const { byMenu, total, count } = aggregateItems(records);
  const cats = groupByCat(byMenu);
  const { totalCost, hasCost } = calcCost(byMenu);

  let html = '';
  CAT_ORDER.forEach(cat=>{
    if(!cats[cat]) return;
    html += `<div class="sales-row head"><span>${cat}</span><span class="q">수량</span><span class="a">금액</span></div>`;

    // 이 카테고리 안에서 메뉴 원본이름(baseName)으로 다시 묶기
    const byBase = {};
    const baseOrder = [];
    Object.keys(cats[cat].items).forEach(key=>{
      const m = cats[cat].items[key];
      if(!byBase[m.baseName]){ byBase[m.baseName] = []; baseOrder.push(m.baseName); }
      byBase[m.baseName].push(m);
    });

    baseOrder.forEach(base=>{
      const variants = byBase[base];
      if(variants.length <= 1){
        // 옵션이 하나뿐이면 그냥 한 줄
        const m = variants[0];
        html += `<div class="sales-row"><span>${m.label}</span><span class="q">${m.qty}</span><span class="a">${fmt(m.amount)}</span></div>`;
      } else {
        // 옵션 2개 이상: 대표 합계 줄(펼침 토글) + 옵션별 상세
        const sumQty = variants.reduce((s,v)=>s+v.qty,0);
        const sumAmt = variants.reduce((s,v)=>s+v.amount,0);
        const collapsed = !!collapsedMenus[base];
        html += `<div class="sales-row menu-sum" data-menutoggle="${base}" style="cursor:pointer;font-family:'Jua',sans-serif;">
          <span>${collapsed?'▶':'▼'} ${base}</span><span class="q">${sumQty}</span><span class="a">${fmt(sumAmt)}</span></div>`;
        if(!collapsed){
          variants.forEach(m=>{
            html += `<div class="sales-row" style="padding-left:16px;color:var(--ink-soft);"><span>${m.label}</span><span class="q">${m.qty}</span><span class="a">${fmt(m.amount)}</span></div>`;
          });
        }
      }
    });

    html += `<div class="sales-row" style="color:var(--sage-deep);"><span>${cat} 소계</span><span class="q">${cats[cat].qty}</span><span class="a">${fmt(cats[cat].amount)}</span></div>`;
  });

  let box = `<div class="sales-total-box">
    <div style="font-size:12px;opacity:0.8;">총 매출 · 주문 ${count}건</div>
    <div class="big">${fmt(total)}원</div>`;
  if(hasCost){
    box += `<div style="font-size:12px;opacity:0.8;margin-top:8px;">원가 합계 ${fmt(totalCost)}원</div>
    <div style="font-size:16px;font-family:'Jua',sans-serif;">순이익 약 ${fmt(total-totalCost)}원</div>`;
  }
  box += `</div>`;

  let out = box + `<div class="sales-card">${html}</div>`;

  // 개별 주문 내역 (주별 상세에서만) - 아코디언
  if(showOrders){
    const sorted = records.slice().sort((a,b)=> (a.completedAt||a.createdAt||0)-(b.completedAt||b.createdAt||0));
    let acc = `<div id="ordersToggle" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;margin:16px 20px 4px;padding:14px 16px;">
      <span style="font-family:'Jua',sans-serif;font-size:15px;">주문 내역 (${sorted.length}건)</span>
      <span style="color:var(--ink-soft);">${ordersExpanded?'▲ 접기':'▼ 펼치기'}</span>
    </div>`;
    if(ordersExpanded){
      acc += sorted.map(o=>`
        <div class="order-card">
          <div class="order-top">
            <div class="order-no">${o.number}번</div>
            <div class="order-time">${timeStr(o.completedAt||o.createdAt)}</div>
          </div>
          <div class="order-items">${(o.items||[]).map(it=>`${it.name}${optLabel(it.temp,it.shot)?' ('+optLabel(it.temp,it.shot)+')':''} ×${it.qty}`).join('<br/>')}</div>
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
            <div class="order-total">${fmt(o.total)}원 ${o.cash?'<span style="color:var(--apricot-deep);font-size:12px;">·현금</span>':''} ${o.coupon?'<span style="color:var(--sage-deep);font-size:12px;">·쿠폰</span>':''}</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="ghost-btn" style="width:auto;padding:8px 16px;color:var(--sage-deep);border-color:var(--sage-deep);" data-seditid="${o.id}" data-sdate="${saleDate}">수정</button>
              <button class="ghost-btn" style="width:auto;padding:8px 16px;color:var(--danger);border-color:var(--danger);" data-sdelid="${o.id}" data-sdate="${saleDate}">삭제</button>
            </div>
          </div>
        </div>
      `).join('');
    }
    out += acc;
  }

  return out;
}

        body += `<div class="sales-date-btn" data-date="${d}">
          <span class="d">${fmtDate(d)}</span>
          <span class="amt">${fmt(total)}원 ›</span>
        </div>`;
        if(openDate===d){
          body += salesDetailHtml(recs, d, true);
        }
      });
    }
  }

  else if(salesView==='month'){
    const months = groupDatesByMonth(salesData.dates||[]);
    const mkeys = Object.keys(months).sort().reverse();
    if(mkeys.length===0){
      body = `<div class="empty-state">${mascotSvg()}<div style="margin-top:10px;">아직 판매 기록이 없어요</div></div>`;
    } else {
      mkeys.forEach(m=>{
        const recs = [];
        months[m].forEach(d=>{ (salesData.salesByDate[d]||[]).forEach(r=>recs.push(r)); });
        const { total } = aggregateItems(recs);
        const [y,mm] = m.split('-');
        body += `<div class="sales-date-btn" data-month="${m}">
          <span class="d">${y}년 ${Number(mm)}월</span>
          <span class="amt">${fmt(total)}원 ›</span>
        </div>`;
        if(openDate===('M'+m)){
          body += salesDetailHtml(recs, null, false);
        }
      });
    }
  }

  else if(salesView==='cost'){
    // 원가 입력 화면
    let rows = '';
    CAT_ORDER.forEach(cat=>{
      const sec = MENU.find(s=>s.cat===cat);
      rows += `<div class="sales-row head"><span>${cat}</span><span class="a">원가(원)</span></div>`;
      sec.items.forEach(it=>{
        const val = salesCosts[it.name] != null ? salesCosts[it.name] : '';
        rows += `<div class="sales-row"><span>${it.name}</span><span class="a"><input class="cost-input" data-cost="${it.name}" inputmode="numeric" value="${val}" placeholder="0"/></span></div>`;
      });
    });
    body = `<div class="sales-card">
      <div style="font-size:13px;color:var(--ink-soft);margin-bottom:10px;">메뉴 한 잔당 재료비를 입력하세요. 입력하면 매출에서 순이익이 자동 계산됩니다.</div>
      ${rows}
      <button class="primary-btn" id="saveCostBtn" style="margin-top:16px;">원가 저장</button>
    </div>`;
  }

  app.innerHTML = `<div class="sales-wrap">
    <div class="sales-header">
      <div style="display:flex;justify-content:space-between;align-items:center;">
      <div>
      <div class="display" style="font-size:22px;">로뎀카페 · 매출</div>
      <div style="font-size:12px;opacity:0.8;margin-top:2px;">일요일 판매 기록</div>
      </div>
      <div class="hamburger" id="salesHamburger">≡</div>
      </div>
    </div>
    ${tabHtml}
    ${body}
  </div>`;

  // 이벤트
  const salesHam = document.getElementById('salesHamburger');
  if(salesHam) salesHam.onclick = ()=> toggleNavMenu('sales');
  document.querySelectorAll('.ctab[data-sv]').forEach(b=>{
    b.onclick = ()=>{ salesView=b.dataset.sv; openDate=null; renderSales(); };
  });
  document.querySelectorAll('.sales-date-btn[data-date]').forEach(b=>{
    b.onclick = ()=>{ const d=b.dataset.date; openDate = (openDate===d? null : d); ordersExpanded=false; renderSales(); };
  });
  document.querySelectorAll('.sales-date-btn[data-month]').forEach(b=>{
    b.onclick = ()=>{ const k='M'+b.dataset.month; openDate = (openDate===k? null : k); renderSales(); };
  });
  const ordersToggle = document.getElementById('ordersToggle');
  if(ordersToggle) ordersToggle.onclick = ()=>{ ordersExpanded = !ordersExpanded; renderSales(); };
  // 메뉴 옵션 펼침/접힘
  document.querySelectorAll('[data-menutoggle]').forEach(b=>{
    b.onclick = ()=>{
      const base = b.dataset.menutoggle;
      if(collapsedMenus[base]) delete collapsedMenus[base];
      else collapsedMenus[base] = true;
      renderSales();
    };
  });
  // 매출 내역 개별 주문 수정
  document.querySelectorAll('[data-seditid]').forEach(b=>{
    b.onclick = ()=>{
      const d = b.dataset.sdate;
      const rec = (salesData.salesByDate[d]||[]).find(x=>x.id===b.dataset.seditid);
      if(rec) openEditOrder(rec, 'sales', d);
    };
  });
  // 매출 내역 개별 주문 삭제 (경고창)
  document.querySelectorAll('[data-sdelid]').forEach(b=>{
    b.onclick = async ()=>{
      const d = b.dataset.sdate;
      const rec = (salesData.salesByDate[d]||[]).find(x=>x.id===b.dataset.sdelid);
      if(!rec) return;
      if(!confirm(rec.number+'번 주문을 매출에서 삭제할까요? 되돌릴 수 없어요.')) return;
      try{
        await fetch(SALES_API, {
          method:'DELETE',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ saleDate: d, id: rec.id })
        });
      }catch(_){}
      loadSales();
    };
  });
  document.querySelectorAll('.cost-input[data-cost]').forEach(inp=>{
    inp.oninput = (e)=>{
      const nm = e.target.dataset.cost;
      const v = e.target.value.replace(/[^0-9]/g,'');
      e.target.value = v;
      if(v==='') delete salesCosts[nm]; else salesCosts[nm] = Number(v);
    };
  });
  const saveCostBtn = document.getElementById('saveCostBtn');
  if(saveCostBtn) saveCostBtn.onclick = async ()=>{
    saveCostBtn.textContent = '저장 중...';
    try{
      await fetch(SALES_API, {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ action:'cost', costs: salesCosts })
      });
      saveCostBtn.textContent = '저장됨 ✓';
      setTimeout(()=>{ saveCostBtn.textContent='원가 저장'; }, 1500);
    }catch(e){
      alert('저장 실패. 다시 시도해주세요.');
      saveCostBtn.textContent = '원가 저장';
    }
  };
}

/* ===================== 화면 전환 햄버거 메뉴 ===================== */
let navMenuOpen = false;
function renderNavMenu(current){
  let host = document.getElementById('navMenuHost');
  if(!host){
    host = document.createElement('div');
    host.id = 'navMenuHost';
    document.body.appendChild(host);
  }
  if(!navMenuOpen){ host.innerHTML=''; return; }
  host.innerHTML = `
    <div class="nav-menu" id="navMenuOverlay">
      <div class="nav-menu-box">
        <div class="nav-item ${current==='counter'?'active':''}" data-nav="counter">🧾 카운터</div>
        <div class="nav-item ${current==='sales'?'active':''}" data-nav="sales">📊 매출</div>
      </div>
    </div>`;
  document.getElementById('navMenuOverlay').onclick = (e)=>{
    if(e.target.id==='navMenuOverlay'){ navMenuOpen=false; renderNavMenu(current); }
  };
  host.querySelectorAll('[data-nav]').forEach(b=>{
    b.onclick = ()=>{
      const dest = b.dataset.nav;
      navMenuOpen = false;
      renderNavMenu(current);
      if(dest !== current){
        location.hash = dest==='counter' ? '#counter' : '#sales';
      }
    };
  });
}
function toggleNavMenu(current){
  navMenuOpen = !navMenuOpen;
  renderNavMenu(current);
}

function boot(){
const vb = document.getElementById('versionBadge');
if(vb) vb.textContent = APP_VERSION;
if(location.hash === '#sales'){
if(sessionStorage.getItem('salesAuth') === '1'){
loadSales();
return;
}
const app = document.getElementById('app');
app.innerHTML = `
<div style="max-width:400px;margin:0 auto;padding:80px 24px;text-align:center;">
${mascotSvg()}
<div style="font-family:'Jua',sans-serif;font-size:18px;margin-top:14px;">매출 비밀번호</div>
<input type="password" id="salesPw" class="text-input" style="margin-top:16px;text-align:center;" placeholder="비밀번호 입력"/>
<button class="primary-btn" style="margin-top:14px;" id="salesPwBtn">확인</button>
</div>
`;
const scheck = ()=>{
const val = document.getElementById('salesPw').value;
if(val === SALES_PASSWORD){
sessionStorage.setItem('salesAuth','1');
loadSales();
} else {
alert('비밀번호가 틀렸어요');
}
};
document.getElementById('salesPwBtn').onclick = scheck;
document.getElementById('salesPw').addEventListener('keydown', e=>{ if(e.key==='Enter') scheck(); });
return;
}
if(location.hash === '#counter'){
if(sessionStorage.getItem('counterAuth') === '1'){
loadOrders();
setInterval(loadOrders, 4000);
return;
}
const app = document.getElementById('app');
app.innerHTML = `
<div style="max-width:400px;margin:0 auto;padding:80px 24px;text-align:center;">
${mascotSvg()}
<div style="font-family:'Jua',sans-serif;font-size:18px;margin-top:14px;">관리자 비밀번호</div>
<input type="password" id="counterPw" class="text-input" style="margin-top:16px;text-align:center;" placeholder="비밀번호 입력"/>
<button class="primary-btn" style="margin-top:14px;" id="counterPwBtn">확인</button>
</div>
`;
const check = ()=>{
const val = document.getElementById('counterPw').value;
if(val === COUNTER_PASSWORD){
sessionStorage.setItem('counterAuth','1');
loadOrders();
setInterval(loadOrders, 4000);
} else {
alert('비밀번호가 틀렸어요');
}
};
document.getElementById('counterPwBtn').onclick = check;
document.getElementById('counterPw').addEventListener('keydown', e=>{ if(e.key==='Enter') check(); });
} else {
checkOpenThenRender();
}
}

// 고객 화면: 오픈 상태 확인 후, 마감이면 공지창 / 오픈이면 메뉴
async function checkOpenThenRender(){
let isOpen = false;
try{
const res = await fetch(API);
const data = await res.json();
isOpen = data.isOpen === true; // 명시적으로 오픈일 때만 열림. 기본은 마감.
}catch(e){ isOpen = false; }
if(isOpen){
render();
} else {
renderClosedNotice();
}
}

function renderClosedNotice(){
const app = document.getElementById('app');
app.innerHTML = `
<div style="max-width:440px;margin:0 auto;padding:70px 28px;text-align:center;min-height:70vh;display:flex;flex-direction:column;justify-content:center;align-items:center;">
<div style="display:flex;justify-content:center;">${mascotSvg()}</div>

<div style="font-family:'Jua',sans-serif;font-size:26px;color:var(--brown);margin-bottom:20px;">로뎀카페 운영시간</div>

<div style="font-size:15px;color:var(--ink-soft);margin-top:22px;white-space:nowrap;">말씀시간에는 카페 운영을 하지 않습니다 🙏</div>
</div>
<button class="ghost-btn" style="margin-top:20px;width:100%;" id="reCheckBtn">새로고침</button>

const btn = document.getElementById('reCheckBtn');
if(btn) btn.onclick = ()=> checkOpenThenRender();
}
boot();
window.addEventListener('hashchange', ()=>{ location.reload(); });
</script>
