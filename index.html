<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>로뎀카페</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
/* wall & wood */
--wall:#8F4D2F;
--wood-dark:#2A1810;
--wood:#4A2C1A;
--wood-mid:#5E3A22;
--wood-lite:#7A4E2E;
/* paper */
--parch:#F5EAD5;
--parch-2:#FBF4E6;
--card:#F9F1E0;
--line:#E4D5B8;
--line-soft:#EFE4CC;
/* ink */
--ink:#3A2618;
--ink-mid:#6B4E33;
--ink-soft:#95795C;
/* accents */
--hot:#B0432D;
--ice:#7A8899;
--gold:#C79A5C;
--leaf:#6E8452;
--leaf-deep:#55673D;
--danger:#B03A29;
--ok:#5E7A46;
/* metrics */
--r-lg:18px;
--r-md:14px;
--r-sm:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
min-height:100vh;
color:var(--ink);
font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
-webkit-font-smoothing:antialiased;
background-color:var(--wall);
background-image:
radial-gradient(140% 70% at 50% -6%, rgba(255,216,158,0.34), rgba(255,216,158,0) 62%),
radial-gradient(120% 90% at 50% 118%, rgba(0,0,0,0.52), rgba(0,0,0,0) 68%),
url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='128' height='64'><rect width='128' height='64' fill='%238d4a2c'/><g fill='%23a55e3a'><rect x='2' y='2' width='60' height='27' rx='3'/><rect x='66' y='2' width='60' height='27' rx='3'/><rect x='-30' y='34' width='60' height='27' rx='3'/><rect x='34' y='34' width='60' height='27' rx='3'/><rect x='98' y='34' width='60' height='27' rx='3'/></g></svg>");
background-attachment:fixed,fixed,fixed;
background-repeat:no-repeat,no-repeat,repeat;
}
.display{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400;}
#app{width:100%;}

/* ===== wall scene / wooden board ===== */
.wall-scene{
width:100%;
min-height:100vh;
padding:clamp(10px,2.4vw,34px) clamp(8px,2.2vw,28px) 118px;
display:flex;justify-content:center;align-items:flex-start;
}
.board{
width:100%;
max-width:520px;
background:var(--parch);
background-image:radial-gradient(120% 60% at 50% 0%, rgba(255,236,197,0.85), rgba(255,236,197,0) 55%);
border-radius:var(--r-lg);
box-shadow:
0 0 0 8px var(--wood-mid),
0 0 0 11px var(--wood-dark),
0 26px 60px rgba(0,0,0,0.45);
overflow:hidden;
position:relative;
}
.board::before{
content:'';position:absolute;inset:0;pointer-events:none;
box-shadow:inset 0 0 60px rgba(122,78,46,0.16);
}

/* ===== brand header ===== */
.brand{
position:relative;
padding:clamp(20px,4.4vw,34px) 18px clamp(14px,2.6vw,20px);
text-align:center;
background:
radial-gradient(90% 120% at 50% -18%, rgba(255,213,148,0.55), rgba(255,213,148,0) 70%),
linear-gradient(180deg,#F2E4C9 0%, var(--parch) 100%);
border-bottom:1px solid var(--line);
}
.lamp{position:absolute;top:0;left:clamp(14px,5vw,42px);color:var(--wood-dark);opacity:.9;}
.lamp.right{left:auto;right:clamp(14px,5vw,42px);display:none;}
.brand-mark{display:inline-block;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;}
.brand-title{
font-size:clamp(30px,7.6vw,52px);
letter-spacing:clamp(2px,1vw,8px);
line-height:1.1;margin-top:2px;color:var(--ink);
}
.brand-sub{
font-size:clamp(10px,2.5vw,14px);
letter-spacing:clamp(1.5px,0.9vw,5px);
color:var(--ink-mid);margin-top:6px;
}
.brand-rule{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;color:var(--gold);}
.brand-rule i{display:block;height:1px;width:clamp(40px,16vw,110px);background:linear-gradient(90deg,transparent,var(--gold),transparent);}

/* ===== category tabs ===== */
.tabs{
display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
padding:clamp(12px,2.4vw,18px) clamp(12px,2.4vw,20px) clamp(10px,2vw,14px);
position:sticky;top:0;z-index:12;
background:linear-gradient(180deg,var(--parch) 72%, rgba(245,234,213,0));
}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{
flex:0 0 auto;display:flex;align-items:center;gap:7px;
font-family:'Jua',sans-serif;font-size:clamp(12px,3vw,15px);
padding:9px 15px;border-radius:12px;
border:1.5px solid var(--line);
background:var(--parch-2);color:var(--ink-mid);
cursor:pointer;white-space:nowrap;letter-spacing:.5px;
transition:background .14s ease,color .14s ease,transform .08s ease;
}
.tab-btn:active{transform:scale(.97);}
.tab-btn.active{
background:linear-gradient(180deg,var(--wood-mid),var(--wood));
border-color:var(--wood-dark);color:var(--parch-2);
box-shadow:0 3px 10px rgba(42,24,16,.3);
}
.tab-ico{display:flex;align-items:center;}

/* ===== menu list ===== */
.menu-list{
display:grid;grid-template-columns:1fr;gap:9px;
padding:0 clamp(12px,2.4vw,20px) clamp(14px,2.6vw,22px);
}
.menu-card{
display:flex;align-items:center;gap:clamp(10px,2.4vw,16px);
background:var(--card);
border:1px solid var(--line);
border-radius:var(--r-md);
padding:clamp(9px,2vw,13px) clamp(11px,2.2vw,16px);
cursor:pointer;
box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 2px 6px rgba(90,58,38,.08);
transition:transform .08s ease,box-shadow .14s ease;
}
.menu-card:active{transform:scale(.985);}
.menu-card:hover{box-shadow:0 2px 12px rgba(90,58,38,.18);}
.menu-icon{
flex:0 0 auto;
width:clamp(42px,10.5vw,54px);height:clamp(42px,10.5vw,54px);
border-radius:11px;
background:linear-gradient(160deg,var(--wood-lite),var(--wood));
color:var(--parch-2);
display:flex;align-items:center;justify-content:center;
box-shadow:0 2px 6px rgba(42,24,16,.28);
}
.menu-text{flex:1 1 auto;min-width:0;}
.menu-name{
font-size:clamp(15px,4vw,20px);font-weight:700;color:var(--ink);
line-height:1.25;
}
.menu-en{font-size:clamp(10px,2.6vw,12.5px);color:var(--ink-soft);margin-top:2px;}
.menu-prices{
flex:0 0 auto;display:flex;align-items:center;gap:clamp(4px,1.2vw,9px);
font-size:clamp(12px,3.2vw,15px);white-space:nowrap;
}
.ptag{font-size:.78em;letter-spacing:.6px;font-weight:700;}
.ptag.hot{color:var(--hot);}
.ptag.ice{color:var(--ice);}
.pval{font-family:'Jua',sans-serif;font-size:1.34em;color:var(--ink);}
.pwon{font-size:.8em;color:var(--ink-soft);margin-left:1px;}
.pdiv{width:1px;height:1.15em;background:var(--line);}

/* ===== board footer ===== */
.board-foot{
background:linear-gradient(180deg,var(--wood-mid),var(--wood));
padding:11px 16px;display:flex;align-items:center;justify-content:space-between;
color:rgba(251,244,230,.62);font-size:11px;letter-spacing:1.5px;
}
.board-foot .leaf{color:rgba(251,244,230,.4);}

/* ===== floating cart bar ===== */
.cart-bar{
position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
width:calc(100% - 32px);max-width:480px;
background:linear-gradient(180deg,var(--wood-mid),var(--wood-dark));
color:var(--parch-2);
border:1.5px solid rgba(199,154,92,.55);
border-radius:var(--r-md);padding:14px 18px;
display:flex;justify-content:space-between;align-items:center;
cursor:pointer;z-index:20;box-shadow:0 10px 28px rgba(0,0,0,.42);
}
.cart-bar-left{font-family:'Jua',sans-serif;font-size:15px;display:flex;align-items:center;gap:9px;}
.cart-badge{
background:var(--gold);color:var(--wood-dark);border-radius:8px;min-width:24px;height:24px;
display:flex;align-items:center;justify-content:center;font-size:13px;padding:0 6px;
}
.cart-bar-right{font-family:'Jua',sans-serif;font-size:17px;color:#F6D9A6;}

/* ===== overlay / sheet ===== */
.overlay{
position:fixed;inset:0;background:rgba(30,17,10,0.58);
z-index:50;display:flex;align-items:flex-end;justify-content:center;
backdrop-filter:blur(2px);
}
.overlay.center{align-items:center;}
.sheet{
width:100%;max-width:520px;background:var(--parch);
border-radius:22px 22px 0 0;
border-top:3px solid var(--wood-mid);
padding:18px 20px calc(20px + env(safe-area-inset-bottom));
max-height:90vh;overflow-y:auto;
animation:sheetUp .18s ease-out;
}
@keyframes sheetUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:44px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 14px;position:relative;cursor:grab;}
.sheet-handle::after{content:'';position:absolute;top:-16px;left:-220px;right:-220px;bottom:-16px;}
.sheet-title{font-family:'Jua',sans-serif;font-size:clamp(19px,5vw,24px);color:var(--ink);}
.sheet-sub{font-size:12px;color:var(--ink-soft);margin-top:3px;letter-spacing:.5px;}

.opt-row{display:flex;gap:10px;margin:16px 0 0;}
.opt-btn{
flex:1;padding:15px 0;text-align:center;
border-radius:var(--r-md);border:1.5px solid var(--line);
background:var(--parch-2);color:var(--ink-mid);
font-family:'Jua',sans-serif;font-size:15px;cursor:pointer;
transition:background .14s ease,color .14s ease;
}
.opt-btn.active{background:linear-gradient(180deg,var(--wood-mid),var(--wood));border-color:var(--wood-dark);color:var(--parch-2);}
.qty-row{
display:flex;align-items:center;justify-content:center;gap:24px;
margin:20px 0;padding:12px 0;
background:var(--parch-2);border:1px solid var(--line-soft);border-radius:var(--r-md);
}
.qty-btn{
width:42px;height:42px;border-radius:11px;border:1.5px solid var(--wood-mid);
background:var(--parch);color:var(--wood);font-size:21px;line-height:1;font-family:'Jua',sans-serif;cursor:pointer;
display:flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto;
-webkit-tap-highlight-color:transparent;user-select:none;
}
.qty-num{font-family:'Jua',sans-serif;font-size:22px;min-width:28px;text-align:center;}
.shot-toggle{
display:flex;align-items:center;justify-content:space-between;
border:1.5px solid var(--line);background:var(--parch-2);
border-radius:var(--r-md);padding:14px 16px;margin-top:12px;cursor:pointer;
font-size:14.5px;color:var(--ink-mid);
}
.shot-toggle.active{background:linear-gradient(180deg,var(--leaf),var(--leaf-deep));border-color:var(--leaf-deep);color:#fff;}
.shot-check{
width:22px;height:22px;border-radius:6px;border:1.5px solid currentColor;
display:flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 auto;
}
.primary-btn{
width:100%;padding:17px 0;border:none;border-radius:var(--r-md);
background:linear-gradient(180deg,var(--wood-mid),var(--wood-dark));
color:var(--parch-2);border:1.5px solid rgba(199,154,92,.5);
font-family:'Jua',sans-serif;font-size:16.5px;cursor:pointer;letter-spacing:.5px;
box-shadow:0 4px 14px rgba(42,24,16,.28);
}
.primary-btn:disabled{opacity:.45;}
.ghost-btn{
width:100%;padding:14px 0;border:1.5px solid var(--wood-mid);border-radius:var(--r-md);
background:transparent;color:var(--wood);font-family:'Jua',sans-serif;font-size:15px;cursor:pointer;
}

/* ===== cart drawer ===== */
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px dashed var(--line);gap:10px;}
.cart-item-name{font-size:14.5px;font-weight:700;color:var(--ink);}
.cart-item-opt{font-size:11.5px;color:var(--ink-soft);}
.cart-item-ctrl{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
.mini-btn{
width:28px;height:28px;border-radius:8px;border:1.5px solid var(--wood-mid);background:var(--parch-2);
color:var(--wood);font-size:15px;line-height:1;cursor:pointer;
display:flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto;
-webkit-tap-highlight-color:transparent;user-select:none;
}
.remove-x{color:var(--danger);font-size:12px;margin-left:6px;cursor:pointer;text-decoration:underline;}
.total-row{
display:flex;justify-content:space-between;align-items:center;
padding:16px 0 6px;font-family:'Jua',sans-serif;font-size:19px;
}
.total-row span:last-child{color:var(--hot);}

/* ===== checkout ===== */
.text-input{
width:100%;padding:14px;border-radius:var(--r-md);border:1.5px solid var(--line);
font-family:'Gowun Dodum',sans-serif;font-size:15px;background:var(--parch-2);color:var(--ink);
}
.pay-card{
background:var(--parch-2);border:1.5px dashed var(--gold);
border-radius:var(--r-lg);padding:18px;margin:16px 0;text-align:center;
}
.pay-card img{width:min(180px,52vw);border-radius:10px;margin-bottom:10px;border:1px solid var(--line);}
.account-box{
background:var(--parch);border:1px solid var(--line-soft);border-radius:var(--r-sm);
padding:11px 14px;margin-top:8px;
display:flex;justify-content:space-between;align-items:center;gap:10px;
}
.account-text{text-align:left;font-size:12.5px;color:var(--ink-soft);}
.account-text b{font-family:'Jua',sans-serif;font-size:15.5px;display:block;color:var(--ink);letter-spacing:.4px;}
.copy-btn{
border:1.5px solid var(--wood-mid);background:var(--parch-2);color:var(--wood);
border-radius:var(--r-sm);padding:8px 12px;font-size:12px;cursor:pointer;flex:0 0 auto;
font-family:'Jua',sans-serif;
}
.amount-big{
font-family:'Jua',sans-serif;font-size:clamp(30px,8vw,40px);color:var(--hot);
text-align:center;margin:12px 0 2px;
}
.pay-hint{text-align:center;font-size:12.5px;color:var(--ink-soft);}
.bell-label{
font-size:clamp(18px,4.8vw,23px);color:var(--ink);margin:6px 0 14px;
font-family:'Jua',sans-serif;text-align:center;
}
.bell-input{
width:100%;padding:16px 14px;border-radius:var(--r-md);border:2px solid var(--wood-mid);
font-family:'Jua',sans-serif;font-size:28px;text-align:center;background:var(--parch-2);
color:var(--ink);letter-spacing:3px;
}
.bell-input::placeholder{font-size:15px;color:var(--ink-soft);letter-spacing:0;}
.bell-pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px;}
.bell-key{
padding:17px 0;text-align:center;border-radius:var(--r-md);border:1.5px solid var(--line);
background:var(--parch-2);color:var(--ink-mid);
font-family:'Jua',sans-serif;font-size:21px;cursor:pointer;
-webkit-tap-highlight-color:transparent;user-select:none;
}
.bell-key.active{background:linear-gradient(180deg,var(--wood-mid),var(--wood));border-color:var(--wood-dark);color:var(--parch-2);}
.bell-key.clear{grid-column:span 5;font-size:15px;background:transparent;border-style:dashed;color:var(--ink-soft);}

/* ===== done ===== */
.done-wrap{padding:clamp(44px,9vw,80px) 26px;text-align:center;}
.order-num-badge{
display:inline-block;font-family:'Jua',sans-serif;
font-size:clamp(46px,13vw,72px);color:var(--ink);
background:var(--parch-2);border:3px solid var(--wood-mid);border-radius:var(--r-lg);
padding:14px clamp(26px,8vw,44px);margin:16px 0;
box-shadow:0 6px 18px rgba(90,58,38,.16);
}

/* ===== closed notice ===== */
.closed-wrap{padding:clamp(40px,8vw,72px) clamp(20px,5vw,40px);text-align:center;}
.hours-card{
background:var(--parch-2);border:1.5px dashed var(--gold);border-radius:var(--r-lg);
padding:clamp(24px,5vw,38px) clamp(16px,4vw,30px);margin-top:22px;
}
.hours-title{font-family:'Jua',sans-serif;font-size:clamp(20px,5.4vw,30px);color:var(--wood);margin-bottom:18px;}
.hours-time{font-family:'Jua',sans-serif;font-size:clamp(26px,8vw,44px);line-height:1.6;color:var(--ink);}
.hours-note{font-size:clamp(13px,3.4vw,16px);color:var(--ink-soft);margin-top:20px;}

/* ===== staff (counter / sales) ===== */
.staff-wrap{
width:100%;max-width:1180px;margin:0 auto;
padding:0 0 60px;
}
.staff-shell{padding:clamp(0px,1.6vw,24px) clamp(0px,1.6vw,24px) 0;}
.staff-header{
background:linear-gradient(180deg,var(--wood-mid),var(--wood-dark));
color:var(--parch-2);padding:18px clamp(16px,3vw,24px);
position:sticky;top:0;z-index:14;
border-bottom:2px solid rgba(199,154,92,.4);
}
.staff-title{font-family:'Jua',sans-serif;font-size:clamp(18px,4.4vw,24px);letter-spacing:1px;}
.staff-sub{font-size:12px;opacity:.75;margin-top:3px;}
.staff-tabs{display:flex;gap:8px;padding:14px clamp(14px,3vw,22px) 0;}
.ctab{
flex:1;text-align:center;padding:11px 0;border-radius:var(--r-md);
font-family:'Jua',sans-serif;font-size:14px;
border:1.5px solid var(--line);background:var(--parch-2);color:var(--ink-mid);cursor:pointer;
}
.ctab.active{background:linear-gradient(180deg,var(--wood-mid),var(--wood));border-color:var(--wood-dark);color:var(--parch-2);}
.order-grid{
display:grid;grid-template-columns:1fr;gap:12px;
padding:14px clamp(14px,3vw,22px) 0;
}
.order-card{
background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
padding:16px;box-shadow:0 2px 8px rgba(42,24,16,.1);
}
.order-card.done{opacity:.55;}
.order-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.order-no{font-family:'Jua',sans-serif;font-size:22px;color:var(--ink);}
.order-time{font-size:11.5px;color:var(--ink-soft);}
.order-name{font-size:13px;color:var(--ink-mid);margin-bottom:8px;}
.order-items{font-size:14.5px;line-height:1.75;margin-bottom:10px;color:var(--ink);}
.order-total{font-family:'Jua',sans-serif;font-size:17px;color:var(--hot);}
.chip-btn{
width:auto;padding:9px 15px;border-radius:var(--r-sm);font-size:13px;
border:1.5px solid var(--wood-mid);background:var(--parch-2);color:var(--wood);
font-family:'Jua',sans-serif;cursor:pointer;
}
.chip-btn.edit{color:var(--leaf-deep);border-color:var(--leaf-deep);}
.chip-btn.del{color:var(--danger);border-color:var(--danger);}
.empty-state{text-align:center;padding:clamp(40px,9vw,80px) 24px;color:var(--ink-soft);}
.pill{
cursor:pointer;font-family:'Jua',sans-serif;font-size:12px;
padding:7px 12px;border-radius:var(--r-sm);border:1.5px solid rgba(251,244,230,.55);
text-align:center;color:var(--parch-2);
}
.open-pill{
cursor:pointer;font-family:'Jua',sans-serif;font-size:15px;padding:0 18px;
border-radius:var(--r-md);border:2px solid var(--parch-2);
display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.25;
}
.hamburger{cursor:pointer;font-size:24px;line-height:1;padding:4px 8px;user-select:none;-webkit-tap-highlight-color:transparent;}
.nav-menu{position:fixed;inset:0;background:rgba(30,17,10,.55);z-index:60;display:flex;align-items:flex-start;justify-content:flex-end;}
.nav-menu-box{background:var(--parch);margin:60px 16px 0;border-radius:var(--r-md);padding:10px;min-width:190px;box-shadow:0 12px 30px rgba(0,0,0,.35);border:1px solid var(--line);}
.nav-item{padding:14px 16px;font-family:'Jua',sans-serif;font-size:15px;border-radius:var(--r-sm);cursor:pointer;display:flex;align-items:center;gap:9px;color:var(--ink-mid);}
.nav-item:hover{background:var(--parch-2);}
.nav-item.active{background:linear-gradient(180deg,var(--wood-mid),var(--wood));color:var(--parch-2);}

/* ===== sales ===== */
.sales-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);margin:14px clamp(14px,3vw,22px);padding:16px;}
.sales-date-btn{
display:flex;justify-content:space-between;align-items:center;
background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
margin:11px clamp(14px,3vw,22px);padding:16px;cursor:pointer;

function fmt(n){ return n.toLocaleString('ko-KR'); }
function optLabel(temp, shot){
const parts = [];
if(temp) parts.push(temp.toUpperCase());
if(shot) parts.push('샷추가');
return parts.join(' · ');
}
function makeDraggable(sheetEl, onClose){
if(!sheetEl) return;
const handle = sheetEl.querySelector('.sheet-handle') || sheetEl;
let startY = 0, dy = 0;
function onMove(e){
const y = e.touches ? e.touches[0].clientY : e.clientY;
dy = Math.max(0, y - startY);
sheetEl.style.transform = `translateY(${dy}px)`;
}
function onUp(){
document.removeEventListener('mousemove', onMove);
document.removeEventListener('mouseup', onUp);
document.removeEventListener('touchmove', onMove);
document.removeEventListener('touchend', onUp);
sheetEl.style.transition = 'transform .18s ease';
if(dy > 90){
sheetEl.style.transform = 'translateY(100%)';
setTimeout(onClose, 140);
} else {
sheetEl.style.transform = 'translateY(0)';
}
}
function onDown(e){
dy = 0;
startY = e.touches ? e.touches[0].clientY : e.clientY;
sheetEl.style.transition = 'none';
document.addEventListener('mousemove', onMove);
document.addEventListener('mouseup', onUp);
document.addEventListener('touchmove', onMove, {passive:true});
document.addEventListener('touchend', onUp);
}
handle.addEventListener('mousedown', onDown);
handle.addEventListener('touchstart', onDown, {passive:true});
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ===================== 아이콘 (선화 스타일) ===================== */
const ICON_PATHS = {

return `<svg width="${s}" height="${s}" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[name] || ICON_PATHS.coffee}</svg>`;

/* ===================== app state ===================== */
let cart = []; // {key,id,name,en,temp,shot,price,qty}
let activeCat = MENU[0].cat;
let sheetItem = null;
let sheetCat = null;
let sheetTemp = null;
let sheetShot = false;
let sheetQty = 1;
let showCartDrawer = false;
let stage = 'menu'; // menu | checkout | done
let bellNo = '';
let cashPlanned = false;
let couponPlanned = false;
let lastOrder = null;
let autoReturnTimer = null;
let submitting = false;
const SHOT_PRICE = 500;
const SHOT_CATS = ['COFFEE','NON COFFEE','TEA'];
let logoClicks = 0;
let logoClickTimer = null;

function cartCount(){ return cart.reduce((s,c)=>s+c.qty,0); }
function cartTotal(){ return cart.reduce((s,c)=>s+c.qty*c.price,0); }
function addToCart(item, temp, qty, shot){
const base = temp==='hot' ? item.hot : temp==='ice' ? item.ice : item.single;
const price = base + (shot ? SHOT_PRICE : 0);
const key = item.id+'-'+(temp||'single')+(shot?'-shot':'');
const existing = cart.find(c=>c.key===key);
if(existing){ existing.qty += qty; }
else { cart.push({ key, id:item.id, name:item.name, en:item.en, temp, shot:!!shot, price, qty }); }
}
function openSheet(item, cat){
sheetItem = item;
sheetCat = cat;
sheetTemp = item.hot ? 'hot' : (item.ice ? 'ice' : null);
sheetShot = false;
sheetQty = 1;
render();
}
function closeSheet(){ sheetItem=null; render(); }

/* ===================== render: customer ===================== */
function brandHeader(sub, tappable){

<div class="brand-sub">${sub || 'RODEM CAFE · RODEM KIOSK'}</div>
<div class="brand-rule"><i></i>${leafRule()}<i></i></div>

function boardFoot(){

function renderMenuScreen(){

const section = MENU.find(m=>m.cat===activeCat);
const itemsHtml = section.items.map(it=>{

priceHtml = `<span class="pval">${fmt(it.single)}</span><span class="pwon">원</span>`;
} else if(it.hot && it.ice){
priceHtml = `<span class="ptag hot">HOT</span><span class="pval">${fmt(it.hot)}</span><span class="pdiv"></span><span class="ptag ice">ICE</span><span class="pval">${fmt(it.ice)}</span>`;
} else if(it.ice){
priceHtml = `<span class="ptag ice">ICE</span><span class="pval">${fmt(it.ice)}</span>`;
}
return `<div class="menu-card" data-item="${it.id}">

<div class="menu-name">${it.name}</div>
<div class="menu-en">${it.en}</div>

<div class="menu-prices">${priceHtml}</div>
</div>`;
}).join('');

<div class="board">

<div class="tabs">${tabsHtml}</div>
<div class="menu-list">${itemsHtml}</div>
${boardFoot()}
</div>
</div>
${cart.length>0 ? `
<div class="cart-bar" id="cartBar">
<div class="cart-bar-left"><span class="cart-badge">${cartCount()}</span> 담은 메뉴 보기</div>
<div class="cart-bar-right">${fmt(cartTotal())}원</div>
</div>` : ''}
`;
}
function renderOptionSheet(){
if(!sheetItem) return '';
const it = sheetItem;
const hasTemp = it.hot && it.ice;
const basePrice = hasTemp ? (sheetTemp==='hot'?it.hot:it.ice) : (it.single!=null? it.single : it.ice);
const canShot = SHOT_CATS.includes(sheetCat);
const unitPrice = basePrice + (canShot && sheetShot ? SHOT_PRICE : 0);
return `
<div class="overlay" id="sheetOverlay">
<div class="sheet" id="sheetBody">
<div class="sheet-handle"></div>
<div style="display:flex;align-items:center;gap:12px;">
<div class="menu-icon">${icon(it.icon,26)}</div>
<div>
<div class="sheet-title">${it.name}</div>
<div class="sheet-sub">${it.en}</div>
</div>
</div>
${hasTemp ? `
<div class="opt-row">
<div class="opt-btn ${sheetTemp==='hot'?'active':''}" data-temp="hot">HOT · ${fmt(it.hot)}원</div>
<div class="opt-btn ${sheetTemp==='ice'?'active':''}" data-temp="ice">ICE · ${fmt(it.ice)}원</div>
</div>` : `<div style="margin:16px 0 0;font-family:'Jua',sans-serif;color:var(--hot);font-size:18px;">${fmt(basePrice)}원</div>`}
${canShot ? `
<div class="shot-toggle ${sheetShot?'active':''}" id="shotToggle">
<span>샷 추가 (+${fmt(SHOT_PRICE)}원)</span>
<span class="shot-check">${sheetShot?'✓':''}</span>
</div>` : ''}
<div class="qty-row">
<div class="qty-btn" id="qtyMinus">−</div>
<div class="qty-num">${sheetQty}</div>
<div class="qty-btn" id="qtyPlus">+</div>
</div>
<button class="primary-btn" id="addCartBtn">${fmt(unitPrice*sheetQty)}원 담기</button>
</div>
</div>`;
}
function renderCartDrawer(){
if(!showCartDrawer) return '';
const itemsHtml = cart.length ? cart.map(c=>`
<div class="cart-item" data-key="${c.key}">
<div>
<div class="cart-item-name">${c.name} ${optLabel(c.temp,c.shot)?`<span class="cart-item-opt">(${optLabel(c.temp,c.shot)})</span>`:''}</div>
<div class="cart-item-opt">${fmt(c.price)}원</div>
</div>
<div class="cart-item-ctrl">
<div class="mini-btn" data-act="minus" data-key="${c.key}">−</div>
<div style="font-family:'Jua',sans-serif;min-width:16px;text-align:center;">${c.qty}</div>
<div class="mini-btn" data-act="plus" data-key="${c.key}">+</div>
<span class="remove-x" data-act="remove" data-key="${c.key}">삭제</span>
</div>
</div>
`).join('') : `<div class="empty-state">${mascotSvg()}<div style="margin-top:12px;">담은 메뉴가 없어요. 메뉴판에서 골라주세요.</div></div>`;
return `
<div class="overlay" id="cartOverlay">
<div class="sheet" id="cartSheetBody">
<div class="sheet-handle"></div>
<div class="sheet-title" style="margin-bottom:8px;">담은 메뉴</div>
${itemsHtml}

function render(){
const app = document.getElementById('app');
let html = '';
if(stage==='menu') html = renderMenuScreen();
else if(stage==='checkout') html = renderCheckout();
else if(stage==='done') html = renderDone();
html += renderOptionSheet();
html += renderCartDrawer();
app.innerHTML = html;
attachHandlers();
// 완료 화면이면 2초 뒤 자동으로 메뉴로 복귀
if(stage==='done'){
if(autoReturnTimer) clearTimeout(autoReturnTimer);
autoReturnTimer = setTimeout(()=>{ resetToMenu(); }, 2000);
}
}
function attachHandlers(){
const brandLogo = document.getElementById('brandLogo');
if(brandLogo) brandLogo.onclick = ()=>{
logoClicks++;
clearTimeout(logoClickTimer);
logoClickTimer = setTimeout(()=>{ logoClicks = 0; }, 1500);
if(logoClicks >= 5){
logoClicks = 0;
location.hash = '#counter';
}
};
document.querySelectorAll('.tab-btn').forEach(b=>{
b.onclick = ()=>{ activeCat = b.dataset.cat; render(); };
});
document.querySelectorAll('.menu-card').forEach(c=>{
c.onclick = ()=>{
const id = c.dataset.item;
const item = MENU.flatMap(m=>m.items).find(i=>i.id===id);
openSheet(item, activeCat);
};
});
const cartBar = document.getElementById('cartBar');
if(cartBar) cartBar.onclick = ()=>{ showCartDrawer = true; render(); };
// option sheet
const sheetOverlay = document.getElementById('sheetOverlay');
if(sheetOverlay){
sheetOverlay.onclick = (e)=>{ if(e.target.id==='sheetOverlay') closeSheet(); };
makeDraggable(document.getElementById('sheetBody'), closeSheet);
document.querySelectorAll('.opt-btn').forEach(b=>{
b.onclick = ()=>{ sheetTemp = b.dataset.temp; render(); };
});
const shotToggle = document.getElementById('shotToggle');
if(shotToggle) shotToggle.onclick = ()=>{ sheetShot = !sheetShot; render(); };
const minus = document.getElementById('qtyMinus');
const plus = document.getElementById('qtyPlus');
if(minus) minus.onclick = ()=>{ if(sheetQty>1) sheetQty--; render(); };
if(plus) plus.onclick = ()=>{ sheetQty++; render(); };
const addBtn = document.getElementById('addCartBtn');
if(addBtn) addBtn.onclick = ()=>{
addToCart(sheetItem, sheetTemp, sheetQty, SHOT_CATS.includes(sheetCat) && sheetShot);
sheetItem = null;
render();
};
}
// cart drawer
const cartOverlay = document.getElementById('cartOverlay');
if(cartOverlay){
cartOverlay.onclick = (e)=>{ if(e.target.id==='cartOverlay'){ showCartDrawer=false; render(); } };
makeDraggable(document.getElementById('cartSheetBody'), ()=>{ showCartDrawer=false; render(); });
document.querySelectorAll('[data-act]').forEach(el=>{
el.onclick = ()=>{
const key = el.dataset.key;
const c = cart.find(x=>x.key===key);
if(!c) return;
if(el.dataset.act==='minus'){ c.qty--; if(c.qty<=0) cart = cart.filter(x=>x.key!==key); }
if(el.dataset.act==='plus'){ c.qty++; }
if(el.dataset.act==='remove'){ cart = cart.filter(x=>x.key!==key); }
render();
};
});
const closeCartBtn = document.getElementById('closeCartBtn');
if(closeCartBtn) closeCartBtn.onclick = ()=>{ showCartDrawer=false; render(); };
const goCheckoutBtn = document.getElementById('goCheckoutBtn');
if(goCheckoutBtn) goCheckoutBtn.onclick = ()=>{ showCartDrawer=false; stage='checkout'; render(); };
}

const API = '/api/orders';

async function submitOrder(){
const n = parseInt(bellNo,10);
if(!bellNo || isNaN(n) || n<1 || n>10){
alert('진동벨 번호(1~10)를 입력해주세요');
return;
}
submitting = true; render();
try{
const res = await fetch(API, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({
name: bellNo,
bell: bellNo,
items: cart.map(c=>({ name:c.name, temp:c.temp, shot:c.shot, price:c.price, qty:c.qty })),
total: cartTotal(),
cash: cashPlanned,
coupon: couponPlanned
})
});
if(res.status === 403){
submitting = false;
renderClosedNotice();
return;
}
if(!res.ok) throw new Error('bad response');
const data = await res.json();
lastOrder = data.order;
submitting = false;
stage = 'done';
render();
}catch(e){
submitting = false;
alert('디버그: ' + e.message);
render();
}
}

/* ===================== counter (staff) view ===================== */
let counterFilter = 'pending';
let counterOrders = [];

const autoPrintedIds = new Set();
let autoPrintPrimed = false;
let autoPrintEnabled = true;
let cafeIsOpen = false;

async function loadOrders(){
if(editState){ return; }
try{
const res = await fetch(API);
const data = await res.json();
const orders = data.orders || [];
orders.sort((a,b)=>b.createdAt-a.createdAt);
counterOrders = orders;
cafeIsOpen = data.isOpen === true;

if(!autoPrintPrimed){
orders.forEach(o=>autoPrintedIds.add(o.id));
autoPrintPrimed = true;
} else if(autoPrintEnabled){
const toPrint = orders
.filter(o=> o.status==='pending' && !autoPrintedIds.has(o.id))
.sort((a,b)=> a.createdAt - b.createdAt);
for(const o of toPrint){
autoPrintedIds.add(o.id);
await printReceipt(o, false);
}
}
}catch(e){ counterOrders = []; }
renderCounter();
}

async function deleteOrder(order){
if(!confirm(order.number+'번 주문을 삭제할까요? 되돌릴 수 없어요.')) return;
try{
await fetch(API, {
method: 'DELETE',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ id: order.id })
});
}catch(_){}
loadOrders();
}

async function toggleStatus(order){
const newStatus = order.status==='pending' ? 'done' : 'pending';
order.status = newStatus;
try{
await fetch(API, {
method: 'PUT',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ id: order.id, status: newStatus })
});
}catch(_){}
loadOrders();
}

/* ===================== 주문 편집 모달 (카운터/매출 공용) ===================== */
let editState = null;

function recalcTotal(items){
  return items.reduce((s,it)=> s + (it.price||0)*(it.qty||1), 0);
}

function openEditOrder(order, context, saleDate){
  editState = {
    context: context || 'counter',
    saleDate: saleDate || order.saleDate || null,
    order: JSON.parse(JSON.stringify(order))
  };
  renderEditModal();
}
function closeEditModal(){ editState = null; renderEditModal(); }

function priceOf(item, temp, shot){
  const base = temp==='hot' ? item.hot : temp==='ice' ? item.ice : item.single;
  return (base||0) + (shot ? SHOT_PRICE : 0);
}

function renderEditModal(){
  let host = document.getElementById('editModalHost');
  if(!host){
    host = document.createElement('div');
    host.id = 'editModalHost';
    document.body.appendChild(host);
  }
  if(!editState){ host.innerHTML=''; return; }

  const items = editState.order.items || [];

  const itemsHtml = items.length ? items.map((it,idx)=>`
    <div class="edit-item">
      <div class="edit-item-name">${it.name}${optLabel(it.temp,it.shot)?` <span style="color:var(--ink-soft);font-size:12px;">(${optLabel(it.temp,it.shot)})</span>`:''}<br><span style="font-size:12px;color:var(--ink-soft);">${fmt((it.price||0)*(it.qty||1))}원</span></div>
      <div class="edit-shot-ctrl">
        <div class="edit-mini" data-eminus="${idx}">−</div>
        <div style="font-family:'Jua',sans-serif;min-width:20px;text-align:center;">${it.qty||1}</div>
        <div class="edit-mini" data-eplus="${idx}">+</div>
        <span style="color:var(--danger);font-size:12px;margin-left:6px;cursor:pointer;" data-eremove="${idx}">삭제</span>
      </div>
    </div>
  `).join('') : `<div style="text-align:center;color:var(--ink-soft);padding:16px;">담긴 메뉴가 없어요</div>`;

  let gridHtml = '';
  MENU.forEach(sec=>{
    gridHtml += `<div style="grid-column:1/-1;font-family:'Jua',sans-serif;font-size:12px;color:var(--leaf-deep);margin-top:8px;">${sec.cat}</div>`;
    sec.items.forEach(it=>{
      const hasTemp = it.hot && it.ice;
      const canShot = SHOT_CATS.includes(sec.cat);
      const st = editState._new && editState._new[it.id] ? editState._new[it.id] : { temp: it.hot?'hot':(it.ice?'ice':null), shot:false };
      gridHtml += `<div class="edit-menu-cell">
        <div class="edit-menu-title">${it.name}</div>
        ${hasTemp ? `<div class="edit-temp-row">
          <div class="edit-temp-btn ${st.temp==='hot'?'active':''}" data-ntemp="${it.id}" data-tv="hot">HOT</div>
          <div class="edit-temp-btn ${st.temp==='ice'?'active':''}" data-ntemp="${it.id}" data-tv="ice">ICE</div>
        </div>` : ''}
        ${canShot ? `<div class="edit-shot-row"><span>샷추가</span>
          <div class="edit-shot-ctrl">
            <div class="edit-mini" data-nshot="${it.id}" data-sv="0">−</div>
            <span style="min-width:14px;text-align:center;">${st.shot?'1':'0'}</span>
            <div class="edit-mini" data-nshot="${it.id}" data-sv="1">+</div>
          </div></div>` : ''}
        <button class="edit-add-btn" data-nadd="${it.id}">담기</button>
      </div>`;
    });
  });

  const total = recalcTotal(items);

  host.innerHTML = `
  <div class="overlay center" id="editOverlay">
    <div class="sheet" style="max-height:90vh;border-radius:20px;max-width:520px;margin:0 16px;border:3px solid var(--wood-mid);border-top:3px solid var(--wood-mid);">
      <div class="sheet-title" style="margin-bottom:4px;">${editState.order.number}번 주문 수정</div>
      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;">담긴 메뉴</div>
      ${itemsHtml}
      <div class="total-row" style="font-size:17px;"><span>합계</span><span>${fmt(total)}원</span></div>
      <div style="font-size:12px;color:var(--ink-soft);margin:14px 0 4px;">메뉴 추가</div>
      <div class="edit-grid">${gridHtml}</div>
      <button class="primary-btn" style="margin-top:16px;" id="editSaveBtn">저장</button>
      <button class="ghost-btn" style="margin-top:10px;" id="editCancelBtn">취소</button>
    </div>
  </div>`;

  const ov = document.getElementById('editOverlay');
  ov.onclick = (e)=>{ if(e.target.id==='editOverlay') closeEditModal(); };

  host.querySelectorAll('[data-eminus]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.eminus; if(items[i].qty>1) items[i].qty--; renderEditModal();
  });
  host.querySelectorAll('[data-eplus]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.eplus; items[i].qty=(items[i].qty||1)+1; renderEditModal();
  });
  host.querySelectorAll('[data-eremove]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.eremove; items.splice(i,1); renderEditModal();
  });

  if(!editState._new) editState._new = {};
  host.querySelectorAll('[data-ntemp]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.ntemp; const it=MENU.flatMap(s=>s.items).find(x=>x.id===id);
    if(!editState._new[id]) editState._new[id]={ temp:it.hot?'hot':'ice', shot:false };
    editState._new[id].temp=b.dataset.tv; renderEditModal();
  });
  host.querySelectorAll('[data-nshot]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.nshot; const it=MENU.flatMap(s=>s.items).find(x=>x.id===id);
    if(!editState._new[id]) editState._new[id]={ temp:it.hot?'hot':(it.ice?'ice':null), shot:false };
    editState._new[id].shot = b.dataset.sv==='1'; renderEditModal();
  });
  host.querySelectorAll('[data-nadd]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.nadd; const it=MENU.flatMap(s=>s.items).find(x=>x.id===id);
    const sec=MENU.find(s=>s.items.some(x=>x.id===id));
    const st = editState._new[id] || { temp: it.hot?'hot':(it.ice?'ice':null), shot:false };
    const canShot = SHOT_CATS.includes(sec.cat);
    const shot = canShot && st.shot;
    const price = priceOf(it, st.temp, shot);
    const exist = items.find(x=> (x.id===id && x.temp===st.temp && x.shot===shot));
    if(exist){ exist.qty=(exist.qty||1)+1; }
    else { items.push({ id:it.id, name:it.name, temp:st.temp, shot:!!shot, price, qty:1 }); }
    renderEditModal();
  });

  document.getElementById('editCancelBtn').onclick = closeEditModal;
  document.getElementById('editSaveBtn').onclick = saveEditOrder;
}

async function saveEditOrder(){
  if(!editState) return;
  const items = editState.order.items || [];
  if(items.length===0){
    alert('메뉴가 최소 1개는 있어야 해요. 주문을 없애려면 삭제 버튼을 사용하세요.');
    return;
  }
  const total = recalcTotal(items);
  const btn = document.getElementById('editSaveBtn');
  if(btn) btn.textContent='저장 중...';
  try{
    if(editState.context==='sales'){
      await fetch(SALES_API, {
        method:'PUT',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ saleDate: editState.saleDate, id: editState.order.id, items, total })
      });
    } else {
      await fetch(API, {
        method:'PUT',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ id: editState.order.id, items, total })
      });
    }
    const ctx = editState.context;
    closeEditModal();
    if(ctx==='sales') loadSales(); else loadOrders();
  }catch(e){
    alert('저장 실패. 다시 시도해주세요.');
    if(btn) btn.textContent='저장';
  }
}

async function printReceipt(order, manual){
try{
const res = await fetch('http://localhost:4000/print', {
method:'POST',
headers:{ 'Content-Type':'application/json' },
body: JSON.stringify({
orderNumber: order.number,
name: order.name,
bell: order.bell || order.name,
items: (order.items||[]).map(it=>({
name: it.name,
quantity: it.qty,
price: it.price,
options: optLabel(it.temp, it.shot)
})),
total: order.total,
cash: order.cash,
coupon: order.coupon
})
});
const data = await res.json();
if(!data.success) throw new Error(data.error||'출력 실패');
}catch(err){
if(manual){
alert('출력 실패: 노트북에서 프린트 서버(start.bat)가 켜져 있는지 확인해주세요.');
}
console.error('영수증 출력 실패:', err);
}
}

function timeStr(ts){
const d = new Date(ts);
return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
}

const COUNTER_PASSWORD = 'juice';

/* ===================== 매출 집계 (staff) ===================== */
const SALES_PASSWORD = 'sales2026';
const SALES_API = '/api/sales';

const NAME_TO_CAT = {};
MENU.forEach(sec => sec.items.forEach(it => { NAME_TO_CAT[it.name] = sec.cat; }));
const CAT_ORDER = MENU.map(m=>m.cat);

let salesData = null;
let salesView = 'week';
let salesCosts = {};
let openDate = null;
let ordersExpanded = false;
let collapsedMenus = {};

async function loadSales(){
  try{
    const res = await fetch(SALES_API);
    salesData = await res.json();
    salesCosts = Object.assign({}, salesData.costs || {});
  }catch(e){
    salesData = { dates:[], salesByDate:{}, costs:{} };
  }
  renderSales();
}

function aggregateItems(records){
  const byMenu = {};
  let total = 0, count = 0;
  records.forEach(r=>{
    total += (r.total||0);
    count += 1;
    (r.items||[]).forEach(it=>{
      const qty = it.qty || 1;
      const price = it.price || 0;
      const opt = optLabel(it.temp, it.shot);
      const label = it.name + (opt ? ` (${opt})` : '');
      const key = label;
      if(!byMenu[key]) byMenu[key] = { qty:0, amount:0, baseName: it.name, label };
      byMenu[key].qty += qty;
      byMenu[key].amount += price * qty;
    });
  });
  return { byMenu, total, count };
}

function groupByCat(byMenu){
  const cats = {};
  Object.keys(byMenu).forEach(key=>{
    const entry = byMenu[key];
    const cat = NAME_TO_CAT[entry.baseName] || '기타';
    if(!cats[cat]) cats[cat] = { items:{}, qty:0, amount:0 };
    cats[cat].items[key] = entry;
    cats[cat].qty += entry.qty;
    cats[cat].amount += entry.amount;
  });
  return cats;
}

function calcCost(byMenu){
  let totalCost = 0;
  let hasCost = false;
  Object.keys(byMenu).forEach(key=>{
    const entry = byMenu[key];
    const c = salesCosts[entry.baseName];
    if(c != null && c !== ''){
      totalCost += Number(c) * entry.qty;
      hasCost = true;
    }
  });
  return { totalCost, hasCost };
}

function fmtDate(d){
  const parts = d.split('-');
  const dt = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
  const wd = ['일','월','화','수','목','금','토'][dt.getDay()];
  return `${Number(parts[1])}/${Number(parts[2])} (${wd})`;
}

function groupDatesByMonth(dates){
  const months = {};
  dates.forEach(d=>{
    const m = d.slice(0,7);
    if(!months[m]) months[m] = [];
    months[m].push(d);
  });
  return months;
}

function salesDetailHtml(records, saleDate, showOrders){
  const { byMenu, total, count } = aggregateItems(records);
  const cats = groupByCat(byMenu);
  const { totalCost, hasCost } = calcCost(byMenu);

  let html = '';
  CAT_ORDER.forEach(cat=>{
    if(!cats[cat]) return;
    html += `<div class="sales-row head"><span>${cat}</span><span class="q">수량</span><span class="a">금액</span></div>`;

    const byBase = {};
    const baseOrder = [];
    Object.keys(cats[cat].items).forEach(key=>{
      const m = cats[cat].items[key];
      if(!byBase[m.baseName]){ byBase[m.baseName] = []; baseOrder.push(m.baseName); }
      byBase[m.baseName].push(m);
    });

    baseOrder.forEach(base=>{
      const variants = byBase[base];
      if(variants.length <= 1){
        const m = variants[0];
        html += `<div class="sales-row"><span>${m.label}</span><span class="q">${m.qty}</span><span class="a">${fmt(m.amount)}</span></div>`;
      } else {
        const sumQty = variants.reduce((s,v)=>s+v.qty,0);
        const sumAmt = variants.reduce((s,v)=>s+v.amount,0);
        const collapsed = !!collapsedMenus[base];
        html += `<div class="sales-row menu-sum" data-menutoggle="${base}" style="cursor:pointer;font-family:'Jua',sans-serif;">
          <span>${collapsed?'▶':'▼'} ${base}</span><span class="q">${sumQty}</span><span class="a">${fmt(sumAmt)}</span></div>`;
        if(!collapsed){
          variants.forEach(m=>{
            html += `<div class="sales-row" style="padding-left:16px;color:var(--ink-soft);"><span>${m.label}</span><span class="q">${m.qty}</span><span class="a">${fmt(m.amount)}</span></div>`;
          });
        }
      }
    });

    html += `<div class="sales-row" style="color:var(--leaf-deep);"><span>${cat} 소계</span><span class="q">${cats[cat].qty}</span><span class="a">${fmt(cats[cat].amount)}</span></div>`;
  });

  let box = `<div class="sales-total-box">
    <div style="font-size:12px;opacity:.8;">총 매출 · 주문 ${count}건</div>
    <div class="big">${fmt(total)}원</div>`;
  if(hasCost){
    box += `<div style="font-size:12px;opacity:.8;margin-top:8px;">원가 합계 ${fmt(totalCost)}원</div>
    <div style="font-size:16px;font-family:'Jua',sans-serif;">순이익 약 ${fmt(total-totalCost)}원</div>`;
  }
  box += `</div>`;

  let out = box + `<div class="sales-card">${html}</div>`;

  if(showOrders){
    const sorted = records.slice().sort((a,b)=> (a.completedAt||a.createdAt||0)-(b.completedAt||b.createdAt||0));
    let acc = `<div id="ordersToggle" class="acc-bar">
      <span style="font-family:'Jua',sans-serif;font-size:15px;">주문 내역 (${sorted.length}건)</span>
      <span style="color:var(--ink-soft);">${ordersExpanded?'▲ 접기':'▼ 펼치기'}</span>
    </div>`;
    if(ordersExpanded){
      acc += `<div class="order-grid">` + sorted.map(o=>`
        <div class="order-card">
          <div class="order-top">
            <div class="order-no">${o.number}번</div>
            <div class="order-time">${timeStr(o.completedAt||o.createdAt)}</div>
          </div>
          <div class="order-items">${(o.items||[]).map(it=>`${it.name}${optLabel(it.temp,it.shot)?' ('+optLabel(it.temp,it.shot)+')':''} ×${it.qty}`).join('<br/>')}</div>
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
            <div class="order-total">${fmt(o.total)}원 ${o.cash?'<span style="font-size:12px;">·현금</span>':''} ${o.coupon?'<span style="color:var(--leaf-deep);font-size:12px;">·쿠폰</span>':''}</div>
            <div style="display:flex;gap:7px;flex-wrap:wrap;">
              <button class="chip-btn edit" data-seditid="${o.id}" data-sdate="${saleDate}">수정</button>
              <button class="chip-btn del" data-sdelid="${o.id}" data-sdate="${saleDate}">삭제</button>
            </div>
          </div>
        </div>
      `).join('') + `</div>`;
    }
    out += acc;
  }

  return out;
}

function renderSales(){
  const app = document.getElementById('app');
  if(!salesData){ app.innerHTML = '<div class="empty-state" style="color:var(--parch);">불러오는 중...</div>'; return; }

  const tabHtml = `
    <div class="staff-tabs">
      <div class="ctab ${salesView==='week'?'active':''}" data-sv="week">주별</div>
      <div class="ctab ${salesView==='month'?'active':''}" data-sv="month">월별</div>
      <div class="ctab ${salesView==='cost'?'active':''}" data-sv="cost">원가</div>
    </div>`;

  let body = '';

  if(salesView==='week'){
    const dates = (salesData.dates||[]).slice().sort().reverse();
    if(dates.length===0){
      body = `<div class="empty-state">${mascotSvg()}<div style="margin-top:12px;">아직 판매 기록이 없어요</div></div>`;
    } else {
      dates.forEach(d=>{
        const recs = salesData.salesByDate[d] || [];
        const { total } = aggregateItems(recs);
        body += `<div class="sales-date-btn" data-date="${d}">
          <span class="d">${fmtDate(d)}</span>
          <span class="amt">${fmt(total)}원 ›</span>
        </div>`;
        if(openDate===d){
          body += salesDetailHtml(recs, d, true);
        }
      });
    }
  }

  else if(salesView==='month'){
    const months = groupDatesByMonth(salesData.dates||[]);
    const mkeys = Object.keys(months).sort().reverse();
    if(mkeys.length===0){
      body = `<div class="empty-state">${mascotSvg()}<div style="margin-top:12px;">아직 판매 기록이 없어요</div></div>`;
    } else {
      mkeys.forEach(m=>{
        const recs = [];
        months[m].forEach(d=>{ (salesData.salesByDate[d]||[]).forEach(r=>recs.push(r)); });
        const { total } = aggregateItems(recs);
        const [y,mm] = m.split('-');
        body += `<div class="sales-date-btn" data-month="${m}">
          <span class="d">${y}년 ${Number(mm)}월</span>
          <span class="amt">${fmt(total)}원 ›</span>
        </div>`;
        if(openDate===('M'+m)){
          body += salesDetailHtml(recs, null, false);
        }
      });
    }
  }

  else if(salesView==='cost'){
    let rows = '';
    CAT_ORDER.forEach(cat=>{
      const sec = MENU.find(s=>s.cat===cat);
      rows += `<div class="sales-row head"><span>${cat}</span><span class="a">원가(원)</span></div>`;
      sec.items.forEach(it=>{
        const val = salesCosts[it.name] != null ? salesCosts[it.name] : '';
        rows += `<div class="sales-row"><span>${it.name}</span><span class="a"><input class="cost-input" data-cost="${it.name}" inputmode="numeric" value="${val}" placeholder="0"/></span></div>`;
      });
    });
    body = `<div class="sales-card">
      <div style="font-size:13px;color:var(--ink-soft);margin-bottom:10px;">메뉴 한 잔당 재료비를 입력하세요. 입력하면 매출에서 순이익이 자동 계산됩니다.</div>
      ${rows}
      <button class="primary-btn" id="saveCostBtn" style="margin-top:16px;">원가 저장</button>
    </div>`;
  }

  app.innerHTML = `<div class="staff-wrap">
    <div class="staff-header">
      <div style="display:flex;justify-content:space-between;align-items:center;">
      <div>
      <div class="staff-title">로뎀카페 · 매출</div>
      <div class="staff-sub">일요일 판매 기록</div>
      </div>
      <div class="hamburger" id="salesHamburger">≡</div>
      </div>
    </div>
    ${tabHtml}
    ${body}
  </div>`;

  const salesHam = document.getElementById('salesHamburger');
  if(salesHam) salesHam.onclick = ()=> toggleNavMenu('sales');
  document.querySelectorAll('.ctab[data-sv]').forEach(b=>{
    b.onclick = ()=>{ salesView=b.dataset.sv; openDate=null; renderSales(); };
  });
  document.querySelectorAll('.sales-date-btn[data-date]').forEach(b=>{
    b.onclick = ()=>{ const d=b.dataset.date; openDate = (openDate===d? null : d); ordersExpanded=false; renderSales(); };
  });
  document.querySelectorAll('.sales-date-btn[data-month]').forEach(b=>{
    b.onclick = ()=>{ const k='M'+b.dataset.month; openDate = (openDate===k? null : k); renderSales(); };
  });
  const ordersToggle = document.getElementById('ordersToggle');
  if(ordersToggle) ordersToggle.onclick = ()=>{ ordersExpanded = !ordersExpanded; renderSales(); };
  document.querySelectorAll('[data-menutoggle]').forEach(b=>{
    b.onclick = ()=>{
      const base = b.dataset.menutoggle;
      if(collapsedMenus[base]) delete collapsedMenus[base];
      else collapsedMenus[base] = true;
      renderSales();
    };
  });
  document.querySelectorAll('[data-seditid]').forEach(b=>{
    b.onclick = ()=>{
      const d = b.dataset.sdate;
      const rec = (salesData.salesByDate[d]||[]).find(x=>x.id===b.dataset.seditid);
      if(rec) openEditOrder(rec, 'sales', d);
    };
  });
  document.querySelectorAll('[data-sdelid]').forEach(b=>{
    b.onclick = async ()=>{
      const d = b.dataset.sdate;
      const rec = (salesData.salesByDate[d]||[]).find(x=>x.id===b.dataset.sdelid);
      if(!rec) return;
      if(!confirm(rec.number+'번 주문을 매출에서 삭제할까요? 되돌릴 수 없어요.')) return;
      try{
        await fetch(SALES_API, {
          method:'DELETE',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ saleDate: d, id: rec.id })
        });
      }catch(_){}
      loadSales();
    };
  });
  document.querySelectorAll('.cost-input[data-cost]').forEach(inp=>{
    inp.oninput = (e)=>{
      const nm = e.target.dataset.cost;
      const v = e.target.value.replace(/[^0-9]/g,'');
      e.target.value = v;
      if(v==='') delete salesCosts[nm]; else salesCosts[nm] = Number(v);
    };
  });
  const saveCostBtn = document.getElementById('saveCostBtn');
  if(saveCostBtn) saveCostBtn.onclick = async ()=>{
    saveCostBtn.textContent = '저장 중...';
    try{
      await fetch(SALES_API, {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ action:'cost', costs: salesCosts })
      });
      saveCostBtn.textContent = '저장됨 ✓';
      setTimeout(()=>{ saveCostBtn.textContent='원가 저장'; }, 1500);
    }catch(e){
      alert('저장 실패. 다시 시도해주세요.');
      saveCostBtn.textContent = '원가 저장';
    }
  };
}

let navMenuOpen = false;
function renderNavMenu(current){
  let host = document.getElementById('navMenuHost');
  if(!host){
    host = document.createElement('div');
    host.id = 'navMenuHost';
    document.body.appendChild(host);
  }
  if(!navMenuOpen){ host.innerHTML=''; return; }
  host.innerHTML = `
    <div class="nav-menu" id="navMenuOverlay">
      <div class="nav-menu-box">
        <div class="nav-item ${current==='counter'?'active':''}" data-nav="counter">🧾 카운터</div>
        <div class="nav-item ${current==='sales'?'active':''}" data-nav="sales">📊 매출</div>
      </div>
    </div>`;
  document.getElementById('navMenuOverlay').onclick = (e)=>{
    if(e.target.id==='navMenuOverlay'){ navMenuOpen=false; renderNavMenu(current); }
  };
  host.querySelectorAll('[data-nav]').forEach(b=>{
    b.onclick = ()=>{
      const dest = b.dataset.nav;
      navMenuOpen = false;
      renderNavMenu(current);
      if(dest !== current){
        location.hash = dest==='counter' ? '#counter' : '#sales';
      }
    };
  });
}
function toggleNavMenu(current){
  navMenuOpen = !navMenuOpen;
  renderNavMenu(current);
}

if(isOpen === customerIsOpen) return;

}
}
